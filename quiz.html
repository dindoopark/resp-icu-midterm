<div class="hero"><h1>연습문제</h1><p class="lede">객관식은 보기를 누르면 바로 채점, 단답형은 입력 후 <b>확인</b>(정확히 안 맞으면 정답을 보고 스스로 채점). 틀린 문제는 이 브라우저에 저장돼서 <b>오답만</b>으로 다시 풀 수 있어요.</p></div>
<div class="qfilters">
<div class="row"><span class="lbl">강의</span><button class="chip on" data-lec="all">전체 127</button><button class="chip" data-lec="drug">약물 26</button><button class="chip" data-lec="struct">구조와 기능 24</button><button class="chip" data-lec="copd">COPD 25</button><button class="chip" data-lec="asthma">천식 26</button><button class="chip" data-lec="ards">ARDS 26</button></div>
<div class="row"><span class="lbl">유형</span><button class="chip on" data-type="all">전체</button><button class="chip" data-type="mcq">객관식</button><button class="chip" data-type="short">단답형</button></div>
<div class="row"><span class="lbl">옵션</span><button class="chip" id="fEmph">🎯 교수 강조만</button><button class="chip" id="fWrong">❌ 오답만</button>
<button class="chip" id="fShuffle">🔀 섞기</button><button class="chip" id="fReset">↺ 기록 초기화</button></div></div>
<div class="score"><span>표시 <b id="sShown">0</b>문항</span><span>푼 문제 <b id="sDone">0</b></span><span>정답 <b id="sOk">0</b></span><span>정답률 <b id="sPct">-</b></span></div>
<div id="list"></div></main><script>
var QS=[{"id": "drug-m01", "type": "mcq", "stem": "호흡곤란의 유발 요인(기전)과 약물 치료 방향을 옳게 연결한 것은?", "choices": ["폐렴 – 폐혈관 수용체 자극과 사강 증가 – 항균제", "대사성 산증(신부전) – 같은 운동명령으로 얻는 흉벽 움직임 감소 – 진단과 원인 치료 우선", "천식·COPD – 기도저항 증가와 과팽창 – 흡입 기관지확장제·코르티코스테로이드", "호흡근 약화(중증 근무력증) – 저산소혈증의 화학수용체 자극 – 진단과 원인 치료 우선", "폐색전증 – 산혈증에 대한 보상성 환기 요구 증가 – 항응고제·혈전용해제"], "answer": 2, "explanation": "p.3~4에서 천식·COPD는 기도저항 증가와 과팽창으로 흡기 여유가 제한되고, 치료 방향은 흡입 기관지확장제와 코르티코스테로이드다. 교수는 유발 요인을 먼저 빠르게 판단해야 약물이 정해진다고 강조했다. 함정: 약물 칸은 모두 p.4대로 맞고 기전 칸만 뒤섞여 있다. 폐렴은 화학수용체 자극, 대사성 산증은 보상성 환기, 폐색전증은 폐혈관 수용체 자극·사강 증가, 호흡근 약화는 같은 명령 대비 흉벽 움직임 감소가 맞는 기전이다.", "source": "DRUG p.3–4 · 9/14 강의 00:07:14", "emphasis": true, "lecture": "drug"}, {"id": "drug-m02", "type": "mcq", "stem": "항콜린제(ipratropium)가 기관지를 확장시키는 기전으로 옳은 것은?", "choices": ["부교감신경 절후 섬유의 아세틸콜린이 기도 평활근의 무스카린 수용체에 결합하지 못하게 차단해 수축을 억제한다", "골격근의 니코틴(Nm) 수용체를 차단해 횡격막을 포함한 근육을 이완시킨다", "기관지 평활근의 β2 수용체를 자극해 평활근을 직접 이완시킨다", "phospholipase A2를 억제해 기도 점막의 염증과 부종을 줄인다", "교감신경절의 니코틴(N) 수용체를 차단해 노르에피네프린 분비를 억제한다"], "answer": 0, "explanation": "p.6~7에서 항콜린제는 콜린성(무스카린) 평활근 수축신호를 차단해 기관지 수축을 억제한다. 함정: 골격근 니코틴(Nm) 수용체 차단은 NMBA의 기전(p.24)이고, β2 수용체 자극은 salbutamol, phospholipase A2 억제는 스테로이드의 기전이다.", "source": "DRUG p.6–7, p.24", "emphasis": false, "lecture": "drug"}, {"id": "drug-m03", "type": "mcq", "stem": "β2 작용제(salbutamol) 투여 후 관찰 내용으로 옳지 않은 것은?", "choices": ["빈맥과 심계항진이 나타나는지 관찰한다", "조절되지 않는 당뇨 환자는 고혈당에 주의한다", "심부정맥이나 저칼륨혈증이 있는 환자는 추가로 확인한다", "투여 후 호흡곤란, 호흡수, 호흡음을 재평가한다", "녹내장 환자는 안압 증가를, 전립선 비대 환자는 요저류를 주의 깊게 확인한다"], "answer": 4, "explanation": "p.9에서 β2 작용제의 이상반응은 빈맥·심계항진·협심증·부정맥·고혈당이고, 주의 대상은 심부정맥·저칼륨혈증·조절되지 않는 당뇨 환자다. 안압 증가·요저류(녹내장·전립선 비대 주의)는 항콜린제의 이상반응이다. 재평가 항목(호흡곤란·호흡수·호흡음)은 두 약이 같다. 천식 강의 p.23은 β작용제 부작용으로 진전(tremor)·저칼륨혈증도 든다.", "source": "DRUG p.9 · ASTHMA p.23", "emphasis": false, "lecture": "drug"}, {"id": "drug-m04", "type": "mcq", "stem": "약물 강의 p.8 표의 기관지확장제 분류에서 지속성 기관지확장제(LABD)로서 질병조절제(controller)에 해당하며, 매일 정해진 시간에 규칙적으로 사용하는 약물은?", "choices": ["salbutamol", "ipratropium", "terbutaline", "tiotropium", "Ventolin과 Atrovent를 섞은 네뷸라이저"], "answer": 3, "explanation": "p.8에서 LAMA(tiotropium, umeclidinium)와 LABA/LAMA 복합제(tiotropium/olodaterol)는 질병조절제로 매일 정해진 시간에 규칙적으로 쓴다. 함정: salbutamol·terbutaline(SABA)과 ipratropium(SAMA)은 지금 당장 호흡곤란이 있을 때 쓰는 증상 완화제이고, Ventolin·Atrovent는 둘 다 속효성이다. 천식 강의(p.28)에서 formoterol(LABA)을 필요시 완화제로 쓰는 것은 이 분류의 예외다.", "source": "DRUG p.8 · ASTHMA p.28", "emphasis": false, "lecture": "drug"}, {"id": "drug-m05", "type": "mcq", "stem": "아라키돈산 경로 도식(p.10)에서 항염증 글루코코르티코이드(스테로이드)가 억제하는 단계는?", "choices": ["Cyclooxygenase", "Phospholipase A2", "Lipoxygenase", "아라키돈산이 류코트리엔으로 전환된 이후 단계", "Thrombin·bradykinin 같은 자극 물질 자체"], "answer": 1, "explanation": "스테로이드는 세포막 인지질에서 아라키돈산을 만드는 phospholipase A2를 억제해, COX·LOX보다 한 단계 위에서 작용한다(p.10 초록 타원). 함정: cyclooxygenase는 aspirin·ibuprofen·indomethacin(NSAIDs)이 억제하는 부위이고, lipoxygenase는 류코트리엔을 만드는 효소다.", "source": "DRUG p.10", "emphasis": false, "lecture": "drug"}, {"id": "drug-m06", "type": "mcq", "stem": "천식과 COPD의 흡입치료 원칙(약물 강의 p.11 표 기준)으로 옳은 것은?", "choices": ["천식의 기류제한 원인은 미주신경 매개 부교감신경 긴장도이다", "COPD 치료의 중심은 ICS를 병용한 약물 치료이다", "ICS는 기관지를 직접 확장하므로 천식에서는 단독으로 사용해도 충분하다", "급성악화 시 천식은 LABA/LAMA로, COPD는 SABA/SAMA로 처치한다", "두 질환 모두 공통으로 흡입기 사용법과 순응도를 평가한다"], "answer": 4, "explanation": "p.11의 공통 평가는 흡입기 사용법과 순응도이며, 교수는 흡입기 종류가 다양하므로 사용법 교육과 순응도 향상이 가장 중요하다고 강조했다. 함정: 천식(호산구성 과민반응 → ICS 병용)과 COPD(미주신경 매개 부교감신경 긴장도 → LABA/LAMA 단독 또는 병용)의 원인·치료가 서로 바뀐 보기, 급성악화는 둘 다 SABA/SAMA, ICS는 기관지를 직접 넓히지 않는다. COPD 강의(10/12)는 기류제한 = 소기도 질환+폐기종(p.4), 1차 = LABA+LAMA 병용(p.18·32)으로 서술한다.", "source": "DRUG p.10–11 · COPD p.4, p.18, p.32 · 9/14 강의 00:28:04", "emphasis": true, "lecture": "drug"}, {"id": "drug-m07", "type": "mcq", "stem": "흡입기 3종(MDI·DPI·SMI)과 복합 흡입기(p.12~13)의 환자 교육으로 옳은 것은?", "choices": ["DPI는 흡입력으로 분사되므로 빠르고 세게 들이마시고, 흡입구에 대고 숨을 내쉬지 않게 한다", "MDI는 약물이 분말로 들어 있어 흔들 필요가 없고, 분사 버튼을 누른 뒤 천천히 숨을 들이마시면 된다", "SMI는 추진제의 압력으로 분사되므로 사용 전 3~4회 흔들고, 분사와 흡기를 동시에 맞춘다", "MDI의 분사–흡기 동조가 어려운 환자는 DPI처럼 빠르고 세게 들이마시도록 교육한다", "설명서에 '흔들어 준다'는 단계가 있는 심비코트 라피헬러는 건조분말 흡입기(DPI)이다"], "answer": 0, "explanation": "p.12에서 DPI는 환자의 흡입력으로 분사되므로 빠르고 세게 흡입해야 하고, 기기에 날숨을 불면 습기로 약이 굳는다. 교수는 흡입기 종류가 많아 사용법 교육과 순응도 향상이 가장 중요하다고 강조했다. 함정: MDI는 추진제가 있어 사용 전 3~4회 흔들고 분사와 천천히 깊은 흡기를 동시에 맞추며, 동조가 어려우면 스페이서를 쓴다(교수). SMI는 추진제·흡입력 없이 스프링 탄성으로 분사되고 장전·교체 과정을 익혀야 한다. 교수는 설명서에 '흔들라'가 있으면 MDI(라피헬러), 돌려서 그냥 들이마시면 DPI(디스커스)라고 구분했다.", "source": "DRUG p.12–13 · 9/14 강의 00:28:04, 00:28:52~00:31:57", "emphasis": true, "lecture": "drug"}, {"id": "drug-m08", "type": "mcq", "stem": "ICS(budesonide, fluticasone) 흡입 후 입안을 헹구고 뱉도록 교육하는 목적은 어떤 부작용을 예방하기 위해서인가?", "choices": ["구강건조, 요저류", "빈맥, 고혈당", "구강 칸디다증, 발성 변화(쉰 목소리)", "기관지 경련, 히스타민 방출", "중대한 고혈당, 근육 약화"], "answer": 2, "explanation": "p.13 하단에 'ICS: 구강 칸디다증, 발성 변화 부작용 예방 필요'라고 되어 있고, 교수는 이 두 가지를 대표 부작용으로 강하게 교육하라고 했다. 디스커스·라피헬러 모두 마지막 단계가 입 헹굼이며, 헹군 물을 삼키면 전신 흡수 가능성이 높아지므로 반드시 뱉게 한다(교수 00:32:21). 함정: 구강건조·요저류는 항콜린제, 빈맥·고혈당은 β2 작용제, 고혈당·근육 약화는 ARDS 전신 스테로이드에서 감시하는 부작용이다.", "source": "DRUG p.13 · 9/14 강의 00:32:21, 00:33:39", "emphasis": true, "lecture": "drug"}, {"id": "drug-m09", "type": "mcq", "stem": "거담제·객담용해제와 핵심 작용의 연결로 옳은 것은?", "choices": ["Guaifenesin – 뮤신의 이황화결합을 화학적으로 파괴", "N-acetylcysteine – 기관지 분비샘의 수분 분비 촉진", "Ambroxol – 연수 기침중추의 역치 증가", "Ambroxol – 폐표면활성제 분비 촉진과 기도 섬모 운동 활성화", "Guaifenesin – 말초 기침 수용체의 C-fiber 억제"], "answer": 3, "explanation": "p.15에서 ambroxol(점액조절제)은 폐표면활성제 분비를 촉진해 점액의 기도벽 접착력을 낮추고, 다당류 사슬을 분해하며, 섬모 운동을 활성화한다. 함정: guaifenesin은 수분 분비 촉진, N-acetylcysteine은 이황화결합 파괴로 둘의 기전이 서로 바뀌어 있고, 기침중추·C-fiber는 진해제의 기전이다.", "source": "DRUG p.15", "emphasis": false, "lecture": "drug"}, {"id": "drug-m10", "type": "mcq", "stem": "객담이 많은 삽관 환자에게 N-acetylcysteine 흡입을 시작했다. 간호로 가장 적절한 것은?", "choices": ["약물이 객담을 직접 제거하므로 흡인(석션) 빈도를 줄인다", "약물은 객담을 묽게 해 배출을 쉽게 할 뿐이므로 기침 유도, 석션, 체위배액, 두드리기로 물리적으로 배출시킨다", "객담 배출을 돕기 위해 dextromethorphan을 함께 투여해 기침을 줄인다", "기관지 경련을 예방하기 위해 기관지확장제보다 먼저 투여한다", "점액은 대부분 뮤신으로 이루어져 있으므로 수분 공급은 효과가 없다"], "answer": 1, "explanation": "교수는 거담제·객담용해제의 핵심이 '가래를 꺼내 주지는 못한다'는 점이라고 강조했다. 배출 기능(섬모 운동과 기침, p.14)은 따로 도와야 하므로 석션과 흉부물리요법이 필요하다. 함정: NAC는 역설적 기관지 경련 위험 때문에 기관지확장제 뒤에 쓰고, 점액은 95%가 물이며, 진해제는 배출에 도움이 되지 않는다.", "source": "DRUG p.14–15 · 9/14 강의 00:41:11", "emphasis": true, "lecture": "drug"}, {"id": "drug-m11", "type": "mcq", "stem": "p.16 'What should we use first?' — 객담이 많은 삽관 환자에게 salbutamol, ipratropium, N-acetylcysteine(뮤코미스트), budesonide 네뷸라이저를 줄 때, 수업에서 설명한 투여 순서로 옳은 것은?", "choices": ["salbutamol → ipratropium → budesonide → N-acetylcysteine → 석션", "N-acetylcysteine → 석션 → salbutamol → ipratropium → budesonide", "salbutamol → budesonide → ipratropium → N-acetylcysteine → 석션", "salbutamol → ipratropium → N-acetylcysteine → budesonide → 석션", "salbutamol → ipratropium → N-acetylcysteine → 석션 → budesonide"], "answer": 4, "explanation": "β2 작용제로 먼저 기관지를 넓히고, 항콜린제로 다시 수축하지 않게 유지한 뒤, NAC로 객담을 묽게 해 석션하고, 마지막에 ICS를 줘야 점막 흡수와 항염증 효과가 커진다. 함정: 앞부분(salbutamol → ipratropium)이 같아도 ICS를 NAC나 석션보다 먼저 주면 객담에 덮인 점막에 흡수가 어렵다. NAC를 맨 처음 주면 역설적 기관지 경련으로 이미 수축·부종된 기도가 악화될 수 있다. 슬라이드 p.16에는 질문만 있고 순서는 수업에서 설명했다.", "source": "DRUG p.16 · 9/14 강의 00:42:02~00:43:23", "emphasis": false, "lecture": "drug"}, {"id": "drug-m12", "type": "mcq", "stem": "진해제의 분류, 대표 약물, 주의사항의 연결로 옳은 것은?", "choices": ["말초성 – levodropropizine – 구심성 경로의 C-fiber 억제, 약간의 졸음·어지럼", "중추성 비마약성 – codeine – 호흡억제, 소화기계 운동성 저하", "중추성 마약성 – dextromethorphan – 과다복용 시 환각", "말초성 – hydrocodone – 연수 기침중추의 역치 증가", "중추성 비마약성 – levodropropizine – 의존성, 호흡억제"], "answer": 0, "explanation": "p.17에서 codeine·hydrocodone은 중추성 마약성(졸음·소화기계 운동성 저하·호흡억제), dextromethorphan은 중추성 비마약성(과다복용 시 환각), levodropropizine은 말초성(C-fiber 억제, 졸음·어지럼)이다. 함정: 연수 기침중추 역치 증가는 중추성 진해제의 작용이고, 약물과 분류가 서로 바뀐 보기가 섞여 있다.", "source": "DRUG p.17", "emphasis": false, "lecture": "drug"}, {"id": "drug-m13", "type": "mcq", "stem": "ARDS에서 전신 스테로이드 사용(ATS 2024 ARDS 지침[2023.9 승인], 대한중환자의학회 지침, 약물 강의 p.21–22)에 대한 설명으로 옳지 않은 것은?", "choices": ["ATS는 전신 스테로이드 사용을 조건부로 제안하며, 근거 확실성은 중등도이다", "통합분석에서 사망률 감소를 지지하고, 기계환기 기간은 평균 약 4일 감소해 단축 가능성을 보였다", "중대한 고혈당 위험이 증가하므로 혈당을 추적하며 조정한다", "대한중환자의학회 지침은 하나의 약물·용량·기간을 단일 표준 요법으로 제시한다", "원인 질환과 감염·대사 합병증 위험을 함께 평가해 개별화하여 적용한다"], "answer": 3, "explanation": "p.22에 '전신 스테로이드 사용 약물/용량/기간 단일 표준 요법은 없음'이라고 굵게 적혀 있고, 교수도 정해진 절대 용량이 없다는 말을 여러 번 반복했다. 나머지 보기는 p.21 내용(조건부/중등도, 사망률·기계환기 기간 감소, 중대한 고혈당 증가, 개별화)이다. 함정: 근거 확실성 '중등도'를 NMBA의 '낮음'과 바꿔 내는 경우를 주의한다.", "source": "DRUG p.21–22", "emphasis": false, "lecture": "drug"}, {"id": "drug-m14", "type": "mcq", "stem": "초기 중증 ARDS 환자(발생 24시간, P/F 75 mmHg, 누적 수분 균형 +3 L)의 승압제 요구량이 계속 늘고 있다. 체액 관리로 가장 적절한 것은?", "choices": ["+3 L 체액 정체가 있으므로 승압제를 유지한 채 저용량 furosemide로 음성 균형을 시작한다", "ESICM 2025가 ARDS 동반 순환부전에서 제한적 수액 전략을 권고하므로 추가 수액을 최소화한다", "적극적 이뇨는 보류하고, 쇼크 원인과 관류 회복을 먼저 평가한 뒤 이뇨 시점을 정한다", "승압제 요구가 늘고 있으므로 수액 반응성을 평가하기 전에 결정질 30 mL/kg을 먼저 추가 투여한다", "폐부종이 있으므로 혈관 내 체액 과다로 보고, 이뇨제 용량은 소변량을 기준으로 정한다"], "answer": 2, "explanation": "p.26·29에서 쇼크·저관류가 지속되거나 승압제 요구량이 늘면 적극적 이뇨를 보류하고 쇼크 원인과 관류 회복을 먼저 평가한다. 순환이 안정된 뒤 체액 과다가 남으면 혈압·소변량·신기능·전해질을 보며 이뇨제를 고려한다. 교수는 패혈증 등에 의한 혈관 누출로 폐부종이 있어도 순환 혈액량은 부족할 수 있어, 이뇨제를 언제·어떻게 쓸지가 가장 중요한 포인트라고 강조했다. 함정: 저용량이라도 승압제 요구가 느는 시기의 이뇨는 보류 대상이고, ESICM 2025 Q10은 ARDS+순환부전의 수액 전략에 '권고 없음(근거 매우 낮음)'이다. 30 mL/kg은 패혈증 초기 소생의 상한이며 추가 투여는 수액 반응성을 평가해 정한다(p.28). 폐부종이 있어도 혈관 내 체액 과다라고 단정할 수 없다(p.20). ARDS 강의의 보존적 수액·이뇨(p.21 '소생 목표 달성 직후', p.26 노트, FACTT)는 쇼크가 풀린 뒤 단계라, 승압제가 늘고 있는 이 사례엔 해당하지 않는다.", "source": "DRUG p.20, p.26, p.28–29 · ARDS p.21, p.26 · 9/14 강의 00:52:32", "emphasis": true, "lecture": "drug"}, {"id": "drug-m15", "type": "mcq", "stem": "Hofmann 제거로 분해되는 NMBA를 지속 주입 중인 ARDS 환자에서 체온·산염기 상태와 약물 분해의 관계로 옳은 것은?", "choices": ["고열이 있으면 Hofmann 분해가 지연되어 약효가 길어진다", "중증 저체온이나 심한 산증이 있으면 Hofmann 분해가 지연된다", "알칼리증이 있으면 분해가 지연되어 축적된다", "간·신부전이 있으면 반감기가 연장되므로 vecuronium으로 바꾼다", "Hofmann 제거는 간 효소에 의존하므로 체온과 pH의 영향을 받지 않는다"], "answer": 1, "explanation": "p.25에서 중증 저체온·심한 산증은 약물 분해를 지연시키고, 고열·알칼리증은 너무 일찍 분해시킨다. 교수는 Hofmann 제거 약물을 쓸 때 체온과 산염기 균형을 잘 유지해야 효과적이라고 강조했다. 함정: Hofmann 제거는 간·신장과 무관한 혈중 자발 분해이고, 간·신부전 시 반감기가 연장되는 것은 vecuronium이다.", "source": "DRUG p.25 · 9/14 강의 01:06:22", "emphasis": true, "lecture": "drug"}, {"id": "drug-m16", "type": "mcq", "stem": "ATS 2024 ARDS 지침(약물 강의 p.19·23, 2023.9 승인)의 초기 중증 ARDS 신경근육차단제(=신경근차단제, NMBA) 권고에 대한 설명으로 옳은 것은?", "choices": ["권고 강도는 조건부이고, 근거 확실성은 전신 스테로이드 권고와 같은 중등도 수준이다", "진정을 얕게 유지하던 환자에서 비동시성이 처음 보이면, 환기 설정·진정 조절보다 먼저 투여한다", "사망률은 깊은 진정 대조군 대비 감소(RR 0.72), 얕은 진정 대조군 대비 감소 없음(RR 0.99)이었다", "압력손상은 감소했고(RR 0.55), ICU 획득 쇠약(ICU-AW)도 감소가 확인되어 근육 손상 우려는 낮다", "빠르게 호전되더라도 근육 소실을 막기 위해 정해진 투여 기간을 모두 채운 뒤 중단한다"], "answer": 2, "explanation": "p.23 결과표에서 깊은 진정 대조군 대비 사망률 RR 0.72(감소 관찰), 얕은 진정 대조군 대비 RR 0.99(감소 관찰 없음)다. 교수는 얕은 진정 대조군 연구가 진정 깊이와 NMBA 여부를 함께 바꾼 비교라 근거가 확실하지 않다고 설명했다. 함정: 근거 확실성은 '낮음'으로 스테로이드(중등도)보다 낮다. 고려 대상은 이미 깊은 진정이 필요하거나 환기 설정·진정 조절에도 심한 비동시성과 임상 악화가 지속되는 환자다. ICU 획득 쇠약은 RR 1.16으로 증가 가능성(불확실)이고, 빠르게 호전되면 근육 소실·신경 손상 예방을 위해 조기 중단한다. [보충] 깊은 진정 대조군은 ARDS 강의 p.80의 이전 RCT 3개, 얕은 진정 대조군은 ROSE로 해석된다.", "source": "DRUG p.23 · ARDS p.80 · 9/14 강의 00:58:01~01:00:45", "emphasis": false, "lecture": "drug"}, {"id": "drug-m17", "type": "mcq", "stem": "천식·COPD 환자의 기도 병태 3가지(p.5)와 치료 표적에 대한 설명으로 옳은 것은?", "choices": ["평활근 수축으로 좁아진 기도는 흡입 코르티코스테로이드가 직접 이완시켜 넓힌다", "기관지확장제로 기도를 넓히면 점막의 염증과 부종도 함께 가라앉는다", "분비물 축적은 기도 개방성과 무관하므로 기관지확장제는 객담 배출에 도움이 되지 않는다", "점막 염증·부종은 항염증 치료(ICS)의 표적이며, ICS는 기관지확장제와 함께 쓴다", "객담이 많아 기도가 막히면 진해제로 기침을 억제해 기도 자극부터 줄인다"], "answer": 3, "explanation": "p.5에서 평활근 수축은 기관지확장제, 점막 염증·부종은 항염증 치료, 분비물 축적은 객담 배출 관리의 표적이다. 교수는 점막이 부은 것은 기관지 확장으로 해결되지 않고 염증 반응 자체를 조절해야 하며(00:08:46), ICS는 기관지를 직접 넓히지 않아 단독으로 쓰기 어렵다고 했다(00:25:26). 구간 마무리에서도 기관지 수축·염증 → 기관지확장제·ICS, 객담 → 거담제·객담용해제, 기침 → 진해제로 정리했다(00:48:10). 함정: 기도 개방성은 객담 배출 3요소 중 하나라 기관지확장제가 배출을 돕고(p.14), 기침은 보호 기능이라 객담이 많을 때 억제하지 않는다. 천식 강의(p.23·28)의 규칙은 반대 방향(LABA·SABA를 ICS 없이 쓰지 않음)이고, 2안 2단계(ICS 유지 + 필요시 SABA)도 'ICS + 기관지확장제' 원칙과 모순되지 않는다.", "source": "DRUG p.5, p.14 · ASTHMA p.23, p.28 · 9/14 강의 00:08:46, 00:48:10", "emphasis": true, "lecture": "drug"}, {"id": "drug-s01", "type": "short", "stem": "흡입기 종류와 관계없이 흡입구를 물기 직전에 해야 하며, 환자가 가장 많이 빠뜨리는 단계라고 교수가 강조한 동작은? (숨을 어떻게 하는가)", "answer": "숨을 끝까지 내쉬기", "accept": ["숨을 끝까지 내쉬기", "숨 끝까지 내쉬기", "끝까지 내쉬기", "숨을 끝까지 내쉰다", "끝까지 내쉰다", "끝까지 숨을 내쉰다", "완전히 내쉬기", "숨을 완전히 내쉰다", "최대한 내쉬기", "최대한 내쉰다", "충분히 내쉬기", "최대 호기", "완전 호기", "full exhalation", "exhale fully"], "explanation": "p.13의 디스커스·라피헬러 사용법 모두 흡입 전에 숨을 끝까지 내쉬는 단계가 있고, 끝까지 내쉬어야 최대로 흡입할 수 있다. 함정: DPI는 흡입구에 대고 숨을 내쉬면 습기로 약이 굳으므로 기기 밖으로 내쉰다.", "source": "DRUG p.13 · 9/14 강의 00:32:00", "emphasis": true, "lecture": "drug"}, {"id": "drug-s02", "type": "short", "stem": "점액 그물망 구조인 이황화결합(S–S)을 화학적으로 파괴해 점도를 급감시키는 점액용해제는?", "answer": "N-acetylcysteine", "accept": ["N-acetylcysteine", "N-acetyl cysteine", "N acetylcysteine", "acetylcysteine", "NAC", "N-아세틸시스테인", "엔아세틸시스테인", "아세틸시스테인", "acetylcystein", "뮤코미스트", "Mucomyst", "뮤테란", "Fluimucil", "플루이무실"], "explanation": "p.15에서 N-acetylcysteine(점액용해제)은 이황화결합을 화학적으로 파괴해 점도를 급감시킨다. 함정: guaifenesin은 수분 분비 촉진, ambroxol은 표면활성제 분비 촉진·섬모 운동 활성화로 기전이 다르다.", "source": "DRUG p.15", "emphasis": false, "lecture": "drug"}, {"id": "drug-s03", "type": "short", "stem": "체온과 생리적 pH에서 혈중 Hofmann 제거로 스스로 분해되어 간·신부전에도 축적되지 않아, ARDS에서 1선 표준으로 선택되는 신경근육차단제는?", "answer": "cisatracurium", "accept": ["cisatracurium", "Cisatracurium", "cis-atracurium", "cisatracurium besylate", "Cistracurium", "cistracurium", "시사트라쿠륨", "시사트라큐륨", "시스아트라쿠리움", "시사트라쿠리움", "시스아트라큐리움", "시사트라큐리움", "Nimbex", "님벡스"], "explanation": "p.25에서 cisatracurium은 Hofmann 제거로 장기 부전 시에도 축적되지 않아 1선 표준 약제다. 함정: atracurium도 Hofmann 제거(+혈장 에스테라제)지만 용량 의존적 히스타민 방출이 있고, vecuronium은 간 대사·신장 배설이라 간·신부전 시 반감기가 연장된다. ARDS 강의 p.82는 비스테로이드계라 ICU-AW가 적고 vecuronium보다 기계환기·ICU 재원 기간이 짧다는 이유도 든다(노트).", "source": "DRUG p.25 · ARDS p.82", "emphasis": false, "lecture": "drug"}, {"id": "drug-s04", "type": "short", "stem": "ATS 2024 ARDS 지침(약물 강의 p.23, 2023.9 승인)에 따라 초기 중증 ARDS에서 NMBA를 사용할 때, 가능하면 최대 몇 시간 이내로 제한하는가? (빠르게 호전되면 조기 중단)", "answer": "48시간", "accept": ["48시간", "48", "48 시간", "48h", "48 h", "48hr", "48hrs", "48 hours", "이틀"], "explanation": "p.23에 '가능하면 최대 48시간 이내로 제한하고, 빠르게 호전되면 조기 중단(근육 소실 및 신경 손상 예방)'이라고 되어 있고, 교수는 이것이 ATS 권고의 가장 중요한 부분이라고 했다. 함정: 초기 중증의 정의인 '발생 48시간 이내'와 사용 기간 '최대 48시간'을 구분한다. ARDS 강의 p.82: 48시간은 절대 상한이 아니다 — 넘기면 최소 12시간마다 필요성을 재평가하고, P/F >150이면 중단한다.", "source": "DRUG p.23 · ARDS p.82 · 9/14 강의 00:59:03", "emphasis": true, "lecture": "drug"}, {"id": "drug-s05", "type": "short", "stem": "ATS 2024 ARDS 지침(약물 강의 p.23)에서 NMBA 사용 대상인 '초기 중증 ARDS'의 중증 기준은 P/F ratio 몇 mmHg 이하인가?", "answer": "100 mmHg", "accept": ["100 mmHg", "100mmHg", "100", "≤100", "100 이하", "100mmHg 이하", "100 mmHg 이하"], "explanation": "p.23에서 초기 중증은 '발생 초기(48시간 이내), 중증 P/F ratio 100 mmHg 이하'다. 함정: 원 연구의 등록 기준(P/F 150 미만)과 헷갈리지 말고 슬라이드 기준 100으로 답한다.", "source": "DRUG p.23", "emphasis": false, "lecture": "drug"}, {"id": "drug-s06", "type": "short", "stem": "p.20 ARDS 약물 사용 목적 표에서 체액 축적은 '폐부종이 있어도 (   ) 과다라고 단정할 수 없다'고 했다. 괄호에 들어갈 말은?", "answer": "혈관 내 체액", "accept": ["혈관 내 체액", "혈관내 체액", "혈관 내 체액량", "혈관내 체액량", "혈관 내 용적", "혈관내 용적", "혈관 내 용량", "혈관 내", "혈관내", "혈관 내 수분", "혈관내 수분량", "순환 혈액량", "순환혈액량", "전신 순환 혈액량", "혈장량", "intravascular volume", "intravascular fluid"], "explanation": "패혈증 등으로 모세혈관 투과성이 높아지면 폐부종이 있어도 전신 순환 혈액량은 부족할 수 있어, 이뇨제를 쓰면 순환이 나빠질 수 있다. 교수는 이뇨제를 언제·어떻게 쓸지가 가장 중요한 포인트라고 강조했다. 함정: '폐부종 = 수분 과다 → 무조건 이뇨'로 연결하지 않는다.", "source": "DRUG p.20 · 9/14 강의 00:52:32", "emphasis": true, "lecture": "drug"}, {"id": "drug-s07", "type": "short", "stem": "패혈증·패혈성 쇼크가 동반된 경우, 초기 소생에서 IV 결정질 수액을 최대 몇 mL/kg까지 투여하는 접근이 조건부로 제안되는가?", "answer": "30 mL/kg", "accept": ["30 mL/kg", "30mL/kg", "30 ml/kg", "30ml/kg", "30 cc/kg", "30cc/kg", "30"], "explanation": "p.28에서 초기 소생은 IV 결정질 수액 최대 30 mL/kg(조건부 권고)이고, 이후 수액 반응성을 평가해 추가 투여한다. 함정: ARDS+순환부전에서 제한적 vs 자유로운 수액 전략은 '권고 없음(근거 매우 낮음)'이다.", "source": "DRUG p.28", "emphasis": false, "lecture": "drug"}, {"id": "drug-s08", "type": "short", "stem": "Atracurium을 고용량으로 쓸 때 기관지 연축·저혈압·홍조를 일으키는, 용량 의존적으로 방출되는 물질은?", "answer": "히스타민", "accept": ["히스타민", "히스타민 방출", "히스타민 유리", "histamine", "Histamine", "histamine release", "histamine liberation"], "explanation": "p.25에서 atracurium은 Hofmann 제거와 혈장 에스테라제로 분해되어 축적 위험은 낮지만, 용량 의존적 히스타민 방출(기관지 연축·저혈압·홍조)이 있다. 함정: 같은 Hofmann 제거 약물이라도 1선은 cisatracurium이다.", "source": "DRUG p.25", "emphasis": false, "lecture": "drug"}, {"id": "drug-s09", "type": "short", "stem": "호흡곤란의 2대 기전 중 하나는 '호흡 구동 증가'다. 나머지 하나로, 호흡명령에 비해 실제 환기와 폐 팽창이 충분하지 않은 상태를 무엇이라 하는가?", "answer": "환기역학 장애", "accept": ["환기역학 장애", "환기역학장애", "환기 역학 장애", "환기역학적 장애", "환기역학", "환기 역학", "impaired ventilatory mechanics", "ventilatory mechanics impairment", "ventilatory mechanics"], "explanation": "p.2에서 호흡곤란은 주관적 호흡 불편감이며, 호흡 구동 증가(더 많이 숨 쉬어야 한다는 요구가 커짐)와 환기역학 장애(호흡명령에 비해 실제 환기·폐 팽창이 부족)로 나눈다. 교수는 중추의 요구와 실제로 폐가 움직일 수 있는 능력이 맞지 않는 불일치(mismatch)가 호흡곤란을 일으킨다고 정리했다. 함정: 호흡근 약화(중증 근무력증·척수손상)는 명령은 와도 흉벽 움직임이 줄어드는 환기역학 쪽 예다.", "source": "DRUG p.2–3 · 9/14 강의 00:07:31", "emphasis": false, "lecture": "drug"}, {"id": "struct-m01", "type": "mcq", "stem": "슬라이드 기준으로 호흡계통 전도부(conducting portion)의 마지막 구조이며, 하나가 폐소엽(pulmonary lobule) 하나에 공기를 운반하는 것은?", "choices": ["세기관지(bronchiole)", "종말세기관지(terminal bronchiole)", "호흡세기관지(respiratory bronchiole)", "3차 기관지(tertiary bronchus)", "폐포관(alveolar duct)"], "answer": 1, "explanation": "p.9에 종말세기관지는 '호흡계통 전도부분의 마지막'이며 종말세기관지마다 폐소엽 하나에 공기를 운반한다고 적혀 있다. 호흡세기관지는 종말세기관지가 폐소엽 안에서 갈라진 것으로 기체교환면으로 공기를 운반하므로 호흡부의 시작이다(p.11). p.2의 'nose ~ bronchiole'만 보고 세기관지를 고르는 것이 함정이다.", "source": "STRUCT p.9, p.11 · 5주차 녹화 강의 00:21:39", "emphasis": true, "lecture": "struct"}, {"id": "struct-m02", "type": "mcq", "stem": "호흡점막의 점액섬모 청소 과정에 대한 설명으로 옳은 것은?", "choices": ["술잔세포(goblet cell)는 섬모를 움직여 점액을 운반하는 세포이다", "점액과 미생물은 섬모 운동으로 폐포 쪽으로 운반되어 폐포대식세포가 처리한다", "고유판(lamina propria)은 상피층의 일부로 surfactant를 분비한다", "점액·미생물은 섬모 운동으로 인두 쪽으로 운반된 뒤 삼켜져 분해된다", "점액은 코안뜰(nasal vestibule)의 털에서만 분비된다"], "answer": 3, "explanation": "p.4: 술잔세포와 점액샘에서 분비된 점액이 점막 표면을 덮고, 점액+미생물이 섬모 운동으로 인두 쪽으로 운반되어 삼켜진 뒤 위산·소화효소로 분해된다. 술잔세포는 섬모세포가 아니라 점액분비세포이고, 운반 방향은 폐포가 아니라 위쪽(인두)이다.", "source": "STRUCT p.4 · 5주차 녹화 강의 00:03:26", "emphasis": true, "lecture": "struct"}, {"id": "struct-m03", "type": "mcq", "stem": "pharynx에 대한 설명으로 옳지 않은 것은?", "choices": ["소화계통과 호흡계통의 공유 공간이다", "뒤콧구멍(choana)에서 후두와 식도 입구까지의 공간이다", "비인두(nasopharynx)는 전형적인 호흡상피로 덮여 있다", "구인두(oropharynx)는 물렁입천장(연구개)과 혀뿌리 사이 공간이다", "음식물은 비인두와 구인두를 거쳐 소화관으로 들어간다"], "answer": 4, "explanation": "p.6에 음식물은 입인두(구인두)와 후두인두를 거쳐 소화관으로 들어간다고 적혀 있고, 비인두는 연구개 위쪽의 호흡상피 구역이라 음식물 경로가 아니다. pharynx는 인두다. 교수는 larynx(후두)와 헷갈리지 않게 '파(pha)링스 → 아임 파인(fine)의 파인 → 인두'로 외우라고 했다(00:09:12).", "source": "STRUCT p.6 · 5주차 녹화 강의 00:09:12, 00:11:33", "emphasis": true, "lecture": "struct"}, {"id": "struct-m04", "type": "mcq", "stem": "후두(larynx)의 구조와 설명의 연결로 옳은 것은?", "choices": ["방패연골(thyroid cartilage) – Adam's apple을 이룬다", "반지연골(cricoid cartilage) – 성대문 위를 덮어 삼킬 때 음식물이 기도로 들어가지 않게 한다", "후두덮개(epiglottis) – 후두 아래쪽에서 기관과 연결된다", "후두 – 인대로 연결된 연골 6개와 민무늬근으로 구성된다", "성문(glottis) – 후두 앞쪽으로 돌출된 연골이다"], "answer": 0, "explanation": "p.7: 방패연골 = Adam's apple, 후두덮개 = 성대문 위를 덮음, 후두 = 인대로 연결된 연골 9개 + 골격근, 공기는 성문(glottis)을 통해 후두로 들어간다. 반지연골은 후두 아래쪽에서 기관과 이어지는 연골이라(p.8) 후두덮개와 역할을 바꿔 놓은 보기가 함정이다.", "source": "STRUCT p.7–8 · 5주차 녹화 강의 00:13:03", "emphasis": true, "lecture": "struct"}, {"id": "struct-m05", "type": "mcq", "stem": "기관·세기관지 민무늬근의 조절에 대한 설명으로 옳은 것은?", "choices": ["교감신경이 흥분하면 세기관지 민무늬근이 수축해 지름이 좁아진다", "부교감신경이 흥분하면 세기관지 민무늬근이 이완해 기도가 넓어진다", "교감신경이 흥분하면 기관과 세기관지의 지름이 모두 커진다", "기관근(trachealis)은 체성신경 지배를 받아 의식적으로 지름을 조절한다", "세기관지 민무늬근은 PCO2가 높아지면 수축해 기도를 좁힌다"], "answer": 2, "explanation": "p.8 기관근은 자율신경 지배로 '교감신경의 흥분을 통해 기관의 지름이 커짐', p.9 세기관지도 '교감신경의 흥분으로 지름 넓어짐'이다. 교수는 부교감신경이 흥분하면 세기관지 민무늬근이 수축해 기도가 좁아지고, 알레르기·염증으로 기도가 좁아진 상태가 천식이라고 덧붙였다(00:20:54). 세기관지 민무늬근은 PCO2가 높아지면 확장한다(p.25). 벤토린(β2 agonist) 네뷸라이저가 기도를 넓히는 근거가 이 교감신경 작용이다(00:17:08).", "source": "STRUCT p.8–9, p.25 · 5주차 녹화 강의 00:20:47", "emphasis": true, "lecture": "struct"}, {"id": "struct-m06", "type": "mcq", "stem": "호흡막(respiratory membrane)에 대한 설명으로 옳은 것은?", "choices": ["폐포 상피, surfactant층, 모세혈관 내피의 3층으로 구성된다", "공기와 혈액 사이 간격은 약 5 µm이고, 세포막이 주된 장벽이다", "O2와 CO2는 수용성이라 호흡막을 쉽게 통과한다", "폐포 상피·모세혈관 내피·융합된 기저막의 3층, 약 0.5 µm다", "폐포 쪽과 모세혈관 쪽 기저막이 따로 있어 모두 4층을 이룬다"], "answer": 3, "explanation": "p.14 텍스트는 3층(폐포 squamous epithelial cell, 모세혈관 endothelial cell, basement membrane)이고, 그림은 0.5 µm와 fused basement membranes를 형광 표시했다. O2·CO2는 지용성이라 쉽게 통과하며, 교수는 상피·내피세포의 세포막도 장벽이 되지 못한다고 했다(00:27:43). surfactant는 그림에서 폐포 쪽 바깥에 있어 3층에 들지 않는다.", "source": "STRUCT p.14 · 5주차 녹화 강의 00:26:20", "emphasis": true, "lecture": "struct"}, {"id": "struct-m07", "type": "mcq", "stem": "흡기(inhalation) 때 일어나는 변화로 옳은 것은? (Po = 바깥 압력, Pi = 폐 안 압력)", "choices": ["횡격막 이완·늑골 상승 → 흉강 용적↑ → Po < Pi", "횡격막 수축·늑골 상승 → 폐 안 압력↓ → Po > Pi", "흉강 용적↑ → 폐 안 압력↑ → 공기가 들어온다", "내늑간근·복직근 수축 → 늑골 상승 → 흉강 용적↑", "휴식기(at rest)에도 Po > Pi → 공기가 조금씩 들어온다"], "answer": 1, "explanation": "p.18 흡기 그림은 늑골·흉골이 올라가고 횡격막이 수축하며, p.19는 'Volume increases; pressure inside falls, and air flows in'과 형광 Po > Pi다. 공기는 압력이 높은 곳에서 낮은 곳으로 흐르므로 안쪽 압력이 떨어져야 들어온다. 내늑간근·복직근은 호기 패널의 근육이고, 호흡 사이 휴식기(at rest)는 Po = Pi로 기류가 없다.", "source": "STRUCT p.18–19 · 5주차 녹화 강의 00:40:00", "emphasis": true, "lecture": "struct"}, {"id": "struct-m08", "type": "mcq", "stem": "슬라이드 p.19 그림의 호기(exhalation) 패널에 형광으로 표시된 근육으로, 강제 호기 때 수축해 늑골을 끌어내리는 근육끼리 묶은 것은?", "choices": ["흉쇄유돌근(sternocleidomastoid), 외늑간근(external intercostal)", "사각근(scalene), 소흉근(pectoralis minor)", "외늑간근(external intercostal), 횡격막(diaphragm)", "전거근(serratus anterior), 흉쇄유돌근(sternocleidomastoid)", "내늑간근(internal intercostals), 복직근(rectus abdominis)"], "answer": 4, "explanation": "p.19 호기 패널의 형광 표시는 internal intercostals·rectus abdominis이고, 흡기 패널은 sternocleidomastoid·external intercostal이다. 늑간근은 '외 = 흡기, 내 = 호기'로 외운다. 단, 안정호흡의 호기는 근육 수축 없이 수동적이고(p.28–29), 날숨근육이 수축하는 능동적 호기는 강제호흡 때다(p.30). 횡격막은 흡기 때 수축, 호기 때 이완한다.", "source": "STRUCT p.19 · 5주차 녹화 강의 00:42:17", "emphasis": true, "lecture": "struct"}, {"id": "struct-m09", "type": "mcq", "stem": "슬라이드 수치(일회호흡량 500 mL, 호기예비량 1000 mL, 남성 흡기예비량 3300 mL, 남성 잔기량 1200 mL)로 계산한 남성의 폐활량(vital capacity)은?", "choices": ["3800 mL", "4300 mL", "4800 mL", "5300 mL", "6000 mL"], "answer": 2, "explanation": "p.21 'Vital capacity = ERV + IRV + Tidal volume'이므로 1000 + 3300 + 500 = 4800 mL로, 교수가 직접 계산한 값과 같다. 잔기량은 폐활량에 들지 않으며, 6000 mL는 잔기량까지 더한 전폐용량(TLC)이라 함정이다.", "source": "STRUCT p.21 · 5주차 녹화 강의 00:50:02", "emphasis": true, "lecture": "struct"}, {"id": "struct-m10", "type": "mcq", "stem": "잔기량(residual volume)과 최소량(minimal volume)에 대한 설명으로 옳지 않은 것은?", "choices": ["잔기량은 폐활량(vital capacity)에 포함된다", "잔기량은 최대 호기 후에도 남아 있는 공기의 양이다", "잔기량은 남성 1200 mL, 여성 1100 mL이다", "최소량은 surfactant로 인해 폐포가 완전히 오그라들지 않고 남아 있는 공기의 양이다", "최소량은 약 30~120 mL로 잔기량 안에 포함된다"], "answer": 0, "explanation": "p.21 폐활량 = ERV + IRV + VT라 잔기량은 들지 않고, 그래프에서도 폐활량 화살표는 잔기량 위에서 끝난다. 최소량(30~120 mL)은 그래프 맨 아래 층으로 잔기량의 일부이며, 교수는 기흉으로 폐가 쪼그라들어도 surfactant 덕분에 남는 공기라고 설명했다.", "source": "STRUCT p.21 · 5주차 녹화 강의 00:47:28", "emphasis": true, "lecture": "struct"}, {"id": "struct-m11", "type": "mcq", "stem": "슬라이드 그림의 위치별 분압(PO2 / PCO2, mmHg) 연결로 옳은 것은?", "choices": ["전신모세혈관에 도착하는 동맥혈 – 95 / 40", "폐포(alveolus) – 40 / 45", "폐동맥에서 폐포모세혈관으로 들어오는 혈액 – 100 / 40", "간질액(interstitial fluid) – 95 / 45", "조직을 떠나 정맥으로 돌아가는 혈액 – 100 / 45"], "answer": 0, "explanation": "p.22: 폐포 100/40, 폐포모세혈관에 들어오는 혈액 40/45 → 나가는 혈액 100/40, 전신모세혈관에 도착하는 동맥혈 95/40, 간질액 40/45, 조직을 떠나는 혈액 40/45다. 동맥 쪽 100/40과 정맥·조직 쪽 40/45를 뒤바꾼 보기가 함정이고, 예외는 조직에 도착한 동맥혈 PO2 95 하나다.", "source": "STRUCT p.22 · 5주차 녹화 강의 00:51:30", "emphasis": true, "lecture": "struct"}, {"id": "struct-m12", "type": "mcq", "stem": "산소 운반에 대한 설명으로 옳은 것은?", "choices": ["동맥혈 산소의 약 7%가 혈장에 용해되어 운반된다", "산소는 혈색소의 globin 부위에 결합해 운반된다", "비활성 조직(PO2 약 40 mmHg)에서는 Hb 결합 O2의 약 80%가 유리된다", "골격근 수축 시 온도↑·pH↓·PO2↓는 Hb의 산소 결합을 줄인다", "Hb의 산소 결합량은 PO2로만 정해지고 pH·온도와는 무관하다"], "answer": 3, "explanation": "p.23: 산소는 약 1.5%만 혈장에 녹고 나머지는 Hb 중앙의 Fe(교수: 헴의 철)에 가역적으로 결합하며, 결합량 결정요인은 PO2·pH·온도다. 골격근 수축 때 온도↑·pH↓·PO2↓가 Hb의 산소 결합을 줄여 골격근에 O2가 충분히 간다. 교수 수치로 비활성 조직(PO2 약 40)은 결합 O2의 약 25%, 활성 조직(PO2 15–20)은 약 80%가 유리되어 약 3배를 공급받는다(00:56:21). 7%와 globin 결합은 CO2 운반 내용이라 섞은 보기가 함정이다.", "source": "STRUCT p.23 · 5주차 녹화 강의 00:56:02", "emphasis": true, "lecture": "struct"}, {"id": "struct-m13", "type": "mcq", "stem": "이산화탄소 운반에 대한 설명으로 옳은 것은?", "choices": ["혈장에 그대로 녹아 운반되는 CO2가 약 70%로 가장 많다", "Hb에 결합하는 CO2는 Fe에 붙어 산소 결합을 방해한다", "약 70%는 탄산탈수효소에 의해 HCO3− 형태로 바뀌어 운반된다", "Hb와 결합하는 CO2는 약 7%이며 oxyhemoglobin을 형성한다", "적혈구 안에서 생긴 HCO3−는 Na+와 교환되어 혈장으로 나간다"], "answer": 2, "explanation": "p.23: 혈장 용해 약 7%, 혈색소의 globin과 결합(carbaminohemoglobin) 약 23%, 탄산(중탄산 이온 HCO3−) 약 70%다. 70%는 적혈구 안에서 탄산탈수효소(carbonic anhydrase)로 H2CO3가 된 뒤 H+와 HCO3−로 해리된다. carbaminohemoglobin은 산소 결합을 방해하지 않아 O2·CO2 동시 운반이 가능하고, HCO3−는 Cl−와 교환되어 나간다(chloride shift). 7/23/70 숫자를 경로와 바꿔 놓은 보기가 함정이다.", "source": "STRUCT p.23–24", "emphasis": false, "lecture": "struct"}, {"id": "struct-m14", "type": "mcq", "stem": "호흡 조절에 관여하는 수용기에 대한 설명으로 옳지 않은 것은?", "choices": ["대동맥체·경동맥체(body)는 동맥혈의 pH, PCO2, PO2를 감지한다", "연수의 화학수용기는 뇌척수액(CSF)의 pH와 PCO2를 감지한다", "대동맥동·경동맥동(sinus)은 혈압을 감지해 순환·호흡중추로 전달한다", "팽창반사는 안정호흡 때는 일어나지 않고 강제호흡 때 작동한다", "화학수용기는 동맥혈 PCO2보다 PO2 변화에 더 민감하게 반응한다"], "answer": 4, "explanation": "p.33은 'PO2보다 PCO2에 더욱 민감'하며 산소수용기를 자극할 만큼 PO2가 낮아지는 일은 거의 없다고 적었다. 대동맥체·경동맥체(body)는 pH·PCO2·PO2, 연수는 CSF의 pH·PCO2만 감지한다. 대동맥동·경동맥동(sinus)은 혈압을 감지하는 압력수용기다(p.32, 동 = 압력·체 = 화학). 팽창반사는 강제호흡 시 폐의 과다팽창을 막고, 팽창·수축반사 모두 안정호흡 때는 일어나지 않는다(p.31).", "source": "STRUCT p.31–33", "emphasis": false, "lecture": "struct"}, {"id": "struct-m15", "type": "mcq", "stem": "연수 호흡리듬중추에 대한 슬라이드 설명으로 옳은 것은?", "choices": ["복측호흡군(VRG)은 매 호흡주기마다 출력을 내보내 외늑간근과 횡격막을 수축시킨다", "안정호흡 때 DRG는 약 2초 방출·3초 정지를 반복하고 호기는 수동적이다", "안정호흡의 호기는 VRG 날숨중추가 날숨근을 수축시켜 능동적으로 일어난다", "배측호흡군(DRG)은 보조호흡근을 수축시키며 강제호흡 시에만 작용한다", "호흡중추는 대뇌피질·변연계에 있는 세 쌍의 신경핵으로 구성된다"], "answer": 1, "explanation": "p.28–29: 흡기중추(DRG)는 매 호흡주기마다 출력을 내보내며 안정호흡 때 2초 방출·3초 멈춤, 비활성기에는 흡기근이 이완해 수동적으로 호기가 일어난다. VRG는 보조호흡근을 수축시키며 강제호흡 시에만 작용한다(능동적 호기, p.30). 호흡중추는 연수·교뇌 망상체의 세 쌍 신경핵이고(p.27), 대뇌피질·변연계·시상하부는 교뇌 호흡중추에 영향을 주는 상위중추다(p.34).", "source": "STRUCT p.27–30, p.34", "emphasis": false, "lecture": "struct"}, {"id": "struct-m16", "type": "mcq", "stem": "폐와 흉막(pleura)에 대한 설명으로 옳지 않은 것은?", "choices": ["벽측흉막은 흉벽 안쪽면·횡격막 윗면·종격 바깥을 덮는다", "장측흉막은 폐 표면을 직접 덮고 폐엽 사이로도 들어간다", "흉막강에 고인 액체를 바늘로 빼내는 것을 흉강천자라 한다", "흉막은 점액을 분비하는 점막(mucous membrane)이다", "우폐는 3엽, 좌폐는 2엽이며 좌폐에 심장패임이 있다"], "answer": 3, "explanation": "p.16에서 벽측흉막(parietal pleura)·장측흉막(visceral pleura)·흉막강(pleural cavity) 세 라벨이 모두 형광 표시됐다. 교수는 흉막이 장막(serous membrane)이라고 '알고 계시면 되겠다'고 했고(00:30:30), 두 층 사이 흉막강의 소량 액체가 숨 쉴 때 마찰을 줄인다고 설명했다. 흉막강에 액체가 차면 흉막삼출, 바늘로 빼는 것이 흉강천자(thoracentesis), 공기가 차면 기흉, 혈액이 고이면 혈흉이다(00:32:15). 폐엽은 우 3·좌 2이고 좌폐에 심장패임(cardiac notch)이 있다(p.15).", "source": "STRUCT p.15–16 · 5주차 녹화 강의 00:30:30", "emphasis": true, "lecture": "struct"}, {"id": "struct-m17", "type": "mcq", "stem": "외호흡(external respiration)과 내호흡(internal respiration)에 대한 설명으로 옳지 않은 것은?", "choices": ["간질액에 O2가 전혀 공급되지 않는 상태를 저산소증(hypoxia)이라 한다", "외호흡은 세포외액(ECF)과 대기 사이에서 O2·CO2가 교환되는 과정이다", "외호흡은 폐환기 → 기체확산 → 기체운반의 3단계로 이루어진다", "기체운반은 폐포 모세혈관과 조직 모세혈관 사이에서 O2·CO2를 나른다", "내호흡은 각 세포가 O2를 흡수하고 CO2를 내보내는 세포 수준의 과정이다"], "answer": 0, "explanation": "p.17: 외호흡 = ECF와 대기 사이의 교환(폐환기·기체확산·기체운반), 내호흡 = 세포 수준. 교수는 3단계를 두 번 나열했다(00:34:29, 00:36:05). 이 과정에 이상이 생겨 간질액 O2가 낮아지고 세포 대사가 떨어지는 것이 저산소증(hypoxia), O2가 전혀 공급되지 않는 것은 무산소증(anoxia)이다(00:35:53).", "source": "STRUCT p.17 · 5주차 녹화 강의 00:34:29", "emphasis": true, "lecture": "struct"}, {"id": "struct-m18", "type": "mcq", "stem": "기관(trachea)과 기관지(bronchus)에 대한 설명으로 옳지 않은 것은?", "choices": ["기관은 후두의 반지연골(cricoid cartilage)에 이어져 시작한다", "C자 연골의 열린 뒤쪽은 기관근이 막고, 그 뒤로 식도가 맞닿는다", "좌측 1차 기관지가 우측보다 굵고 수직에 가까워 이물질이 좌측으로 잘 들어간다", "carina는 기관이 좌·우 1차 기관지로 갈리는 곳으로 삽관 튜브 위치 확인 기준이다", "기관지가 갈라지다 지름 약 1 mm에서 연골이 완전히 없어지면 세기관지라 한다"], "answer": 2, "explanation": "교수 설명(00:18:44): 우측 1차 기관지가 좌측보다 지름이 크고 수직에 가까워, 기관으로 들어간 이물질은 우측으로 갈 확률이 높다. carina는 삽관 튜브 위치를 확인하는 기준점이다(00:17:57). 기관은 반지연골에 이어지고(p.8), C자 연골의 열린 뒤쪽은 탄력인대·민무늬근(기관근)으로 식도와 맞닿으며, 지름 약 1 mm에서 연골이 완전히 없어지면 세기관지다(p.9).", "source": "STRUCT p.8–9 · 5주차 녹화 강의 00:18:44", "emphasis": true, "lecture": "struct"}, {"id": "struct-s01", "type": "short", "stem": "안정 시 한 번 들이쉰 약 500 mL 가운데 약 350 mL만 폐포에 닿고, 나머지 약 150 mL는 기관·기관지에 머물러 기체교환에 참여하지 못한다. 이 공간을 무엇이라 하는가?", "answer": "해부학적 사강(anatomic dead space)", "accept": ["해부학적 사강", "해부학적사강", "해부사강", "해부학적 사강(anatomic dead space)", "해부학적 무효공간", "해부학적무효공간", "사강", "dead space", "Dead space", "anatomic dead space", "Anatomic dead space", "anatomical dead space", "Anatomical dead space", "anatomic dead space(해부학적 사강)"], "explanation": "교수가 '제가 여기 쓰지는 않았지만'이라며 덧붙인 내용이다(00:47:51). 안정 일회호흡량 약 500 mL 중 약 350 mL는 폐포까지 가지만 약 150 mL는 기관·기관지에 머물러 혈액과 기체교환을 하지 못하며, 이를 해부학적 사강(해부사강)이라 한다. 슬라이드에는 없으므로 150 mL라는 숫자와 함께 외운다.", "source": "5주차 녹화 강의 00:47:51 (슬라이드 없음)", "emphasis": true, "lecture": "struct"}, {"id": "struct-s02", "type": "short", "stem": "폐포 표면으로 surfactant를 분비해 폐포 수분층의 표면장력을 낮추는 세포의 이름은? (그림 라벨 용어도 인정)", "answer": "과립폐포세포(great alveolar cell)", "accept": ["과립폐포세포", "과립 폐포세포", "과립폐포 세포", "과립 폐포 세포", "great alveolar cell", "Great alveolar cell", "과립폐포세포(great alveolar cell)", "septal cell", "Septal cell", "중격세포", "제2형 폐포세포", "2형 폐포세포", "II형 폐포세포", "type II pneumocyte", "type 2 pneumocyte", "type II alveolar cell", "type 2 alveolar cell", "대폐포세포", "과립성 폐포세포", "과립성폐포세포", "제2형 폐포상피세포", "II형 폐포상피세포", "2형 폐포상피세포", "type II cell", "Type II cell", "pneumocyte type II", "Type II pneumocyte", "Type 2 pneumocyte", "type II alveolar epithelial cell", "ATII", "AT2", "AT-II", "ATII 세포", "2형 폐포세포(ATII)", "alveolar type II cell", "AEC2", "Ⅱ형 폐포세포", "제Ⅱ형 폐포세포", "Ⅱ형 폐포상피세포"], "explanation": "p.13 Great alveolar cell(과립폐포세포)이 surfactant를 분비하며, 그림의 형광 라벨 'Septal cell (secretes surfactant)'도 같은 세포다. surfactant가 없으면 폐포가 쪼그라들어 호흡곤란증후군(RDS)으로 이어진다(교수 설명). 먼지를 포식하는 폐포대식세포(dust cell)와 혼동하지 않는다.", "source": "STRUCT p.13 · 5주차 녹화 강의 00:25:31", "emphasis": true, "lecture": "struct"}, {"id": "struct-s03", "type": "short", "stem": "슬라이드의 여성 수치(일회호흡량·호기예비량은 공통값, 흡기예비량·잔기량은 여성값)로 계산한 여성의 전폐용량(total lung capacity)은 몇 mL인가?", "answer": "4500 mL", "accept": ["4500", "4500 mL", "4500mL", "4500 ml", "4500ml", "4500 mℓ", "4500mℓ", "4500cc", "4500 cc", "4,500", "4,500 mL", "4,500mL", "4,500 ml", "4,500cc", "4,500 cc", "4.5 L", "4.5L", "4.5 l", "4.5 리터", "4.5리터", "약 4500", "약 4500 mL", "약 4500 cc"], "explanation": "p.21 값으로 폐활량 = 1900(IRV) + 500(VT) + 1000(ERV) = 3400 mL, 전폐용량 = 3400 + 1100(RV) = 4500 mL다. 교수도 녹화에서 처음 '4200'이라 했다가 다시 더해 4500으로 고쳤다(00:51:14). 3400(폐활량)에서 멈추는 것이 함정이다. [보충] 교과서(Martini)는 여성 ERV 700으로 TLC 4200이라 숫자가 다르니, 계산은 슬라이드 값 기준으로 한다. 남성은 같은 방식으로 VC 4800·TLC 6000 mL다.", "source": "STRUCT p.21 · 5주차 녹화 강의 00:50:53", "emphasis": true, "lecture": "struct"}, {"id": "struct-s04", "type": "short", "stem": "폐기종(emphysema)에서는 높아지고 surfactant가 부족한 호흡곤란증후군(RDS)에서는 낮아지며, 낮을수록 호흡에 드는 에너지가 커지는 폐의 특성은?", "answer": "순응도(compliance)", "accept": ["순응도", "compliance", "Compliance", "순응도(compliance)", "compliance(순응도)", "폐순응도", "폐 순응도", "유순도", "폐 유순도", "폐유순도", "유순도(compliance)", "lung compliance", "Lung compliance", "pulmonary compliance", "컴플라이언스"], "explanation": "교수는 컴플라이언스를 순응도라고도 부르며(00:42:37), 폐기종은 폐포 지지조직 파괴로 순응도↑, RDS는 surfactant 부족으로 순응도↓, 늑골·척추 관절염도 순응도↓라고 설명했다(00:43:14). p.20 정의는 '탄력성, 팽창능력'이고 low compliance면 호흡 에너지 소모량이 증가한다(평소 기초 에너지 소모량의 3~5%). 순응도가 높다고 정상은 아니다(폐기종). COPD 강의(p.4·10)의 '폐기종 → 탄성 감소'는 탄성 반동↓ = 순응도↑로 같은 현상이다.", "source": "STRUCT p.20 · 5주차 녹화 강의 00:43:07", "emphasis": true, "lecture": "struct"}, {"id": "struct-s05", "type": "short", "stem": "CO2 운반 과정에서 적혈구 안에서 만들어진 HCO3−가 Cl−와 맞바뀌어 적혈구 밖(혈장)으로 나가는 현상의 이름은?", "answer": "염소이동(chloride shift)", "accept": ["chloride shift", "Chloride shift", "chloride-shift", "염소이동", "염소 이동", "염소이동(chloride shift)", "chloride shift(염소이동)", "염화물 이동", "염화물이동", "염소이온 이동", "클로라이드 시프트", "클로라이드 쉬프트", "Hamburger shift", "hamburger shift", "Hamburger phenomenon", "hamburger phenomenon", "햄버거 현상", "햄버거현상", "Cl- shift", "Cl− shift", "클로라이드 이동", "염화이온 이동", "염화이온이동"], "explanation": "p.23 그림: CO2의 70%는 적혈구 안에서 탄산탈수효소로 H2CO3가 된 뒤 H+와 HCO3−로 해리되고, H+는 완충제(특히 Hb)가 제거하며 HCO3−는 Cl−와 교환되어 나간다(chloride shift). 폐에서는 이 과정이 거꾸로 진행되어 CO2를 내보낸다(p.24).", "source": "STRUCT p.23–24", "emphasis": false, "lecture": "struct"}, {"id": "struct-s06", "type": "short", "stem": "국소 호흡 조절에서, PO2가 낮은 폐포 쪽에서 수축해 폐동맥 혈액을 PO2가 높은 폐포의 모세혈관으로 보내는 구조는? (슬라이드 용어)", "answer": "모세혈관앞괄약근·모세혈관앞조임근(precapillary sphincter)", "accept": ["precapillary sphincter", "Precapillary sphincter", "precapillary sphincters", "모세혈관앞괄약근", "모세혈관 앞 괄약근", "모세혈관앞 괄약근", "모세혈관전괄약근", "모세혈관 전 괄약근", "전모세혈관괄약근", "전모세혈관 괄약근", "모세혈관앞괄약근(precapillary sphincter)", "모세혈관앞조임근", "모세혈관 앞 조임근", "모세혈관앞 조임근", "모세혈관전조임근", "모세혈관 전 조임근", "전모세혈관조임근", "전모세혈관 조임근", "pre-capillary sphincter", "Pre-capillary sphincter", "모세혈관앞조임근(precapillary sphincter)"], "explanation": "p.25: 폐동맥 혈액이 PO2가 높은 폐포 모세혈관으로 가는 것은 PO2가 낮은 폐포의 precapillary sphincter가 수축해 혈류 방향을 조절하기 때문이다. 강의가 쓰는 Martini 국역 용어(술잔세포·반지연골·민무늬근)로는 sphincter를 '조임근'이라 하므로 모세혈관앞조임근도 같은 답이다. 말초조직에서는 PO2가 낮아지면 세동맥 민무늬근이 이완해 혈류가 늘어 방향이 반대라는 점이 함정이다. [보충] 생리학 용어로는 저산소성 폐혈관수축(HPV)이지만 이 문항은 슬라이드의 구조 이름을 묻는다.", "source": "STRUCT p.25", "emphasis": false, "lecture": "struct"}, {"id": "copd-m01", "type": "mcq", "stem": "국내 COPD 진료지침 2024 개정의 핵심 변화로 옳지 않은 것은?", "choices": ["가·나·다군 분류를 고위험군·저위험군 2분류로 바꾸었다", "분류 기준을 지난 1년간 급성악화력 중심으로 바꾸었다", "혈액 호산구 수치를 평가 항목으로 새로 포함하였다", "mMRC와 CAT 점수로 고위험군과 저위험군을 나눈다", "mMRC와 CAT은 증상 평가 도구로 계속 사용한다"], "answer": 3, "explanation": "2024 개정에서 mMRC·CAT은 위험군 분류 기준에서 빠지고 증상 평가 도구로만 남았으며, 위험군은 지난 1년간 급성악화력 하나로 나눈다. 개정 전 가·나·다군에서는 증상 점수가 군 분류에 들어갔기 때문에 이를 현재 기준으로 착각하기 쉽다.", "source": "COPD p.14 · 10/12 강의 01:20:03", "emphasis": true, "lecture": "copd"}, {"id": "copd-m02", "type": "mcq", "stem": "mMRC 호흡곤란 점수와 내용의 연결로 옳은 것은?", "choices": ["0점 – 평지를 빨리 걷거나 약간 오르막을 걸을 때 숨이 차다", "3점 – 평지를 약 100 m 정도 걷거나 몇 분 동안 걸으면 숨이 차서 멈춰 쉬어야 한다", "1점 – 평지를 걸을 때 숨이 차서 동년배보다 천천히 걷거나, 자기 속도로 걸어도 멈춰 쉬어야 한다", "2점 – 숨이 너무 차서 집을 나설 수 없거나 옷을 입고 벗을 때도 숨이 차다", "4점 – 힘든 운동을 할 때만 숨이 차다"], "answer": 1, "explanation": "3점은 평지를 약 100 m 또는 몇 분 걸으면 멈춰 쉬어야 하는 단계다. 1점(평지를 빨리 걷거나 약간 오르막)과 2점(평지 보통 보행에서도 동년배보다 느리거나 멈춰 쉼)은 '평지를 걸을 때 숨이 차는가'로 갈리고, 0점은 힘든 운동 때만, 4점은 집 밖에 못 나가거나 옷 입고 벗을 때도 숨참이다.", "source": "COPD p.12 · 10/12 강의 01:17:24", "emphasis": true, "lecture": "copd"}, {"id": "copd-m03", "type": "mcq", "stem": "COPD 약물치료에 대한 설명으로 옳은 것은? (COPD 강의·국내 지침 2024 기준)", "choices": ["천식과 마찬가지로 COPD에서도 흡입스테로이드(ICS)가 가장 중요한 주된 치료제이다", "급성악화를 예방하기 위해 모든 COPD 환자에게 진단 시점부터 ICS를 지속 사용한다", "로플루밀라스트(PDE4 억제제)는 급성악화 시 증상을 빠르게 완화하는 속효성 기관지확장제이다", "1차 약제는 LAMA 단독요법이며, LABA 병용은 부작용 때문에 권고되지 않는다", "기관지확장제가 주된 치료이고, ICS는 악화 고위험이면서 호산구가 높은 환자에게 추가한다"], "answer": 4, "explanation": "COPD는 비가역적 기류제한이라 기관지확장제(β2 작용제·항콜린제·메틸잔틴, 병합요법)가 주된 치료이며, ICS는 처음부터 모두에게 쓰지 않고 악화 고위험이면서 혈중 호산구가 높은 환자에게 추가한다(안정 시 규칙: 고위험군 그리고 호산구 ≥ 300/mm³이면 ICS 포함 3제). ICS가 주약제인 것은 천식이고, 로플루밀라스트는 기관지확장제가 아닌 경구 유지요법제이며, 1차는 LABA+LAMA 병용이다.", "source": "COPD p.16, 18 · 10/12 강의 01:22:27", "emphasis": true, "lecture": "copd"}, {"id": "copd-m04", "type": "mcq", "stem": "지난 1년간 항생제와 경구 스테로이드가 필요했던 중등증 급성악화가 1회(입원 없음) 있었던 COPD 환자다. mMRC 1점, CAT 8점이다. 국내 지침(2024)과 GOLD 2026에 따른 분류로 옳은 것은?", "choices": ["국내 고위험군 / GOLD E군", "국내 저위험군 / GOLD A군", "국내 저위험군 / GOLD E군", "국내 고위험군 / GOLD A군", "국내 저위험군 / GOLD B군"], "answer": 2, "explanation": "국내는 지난 1년 급성악화 2회 이상 또는 입원 악화 1회 이상이어야 고위험군이므로 입원 없는 1회는 저위험군이다. GOLD 2026은 중등증·중증 악화가 1회 이상이면 증상과 관계없이 E군이므로, mMRC 0–1·CAT < 10만 보고 A군을 고르는 것이 함정이다.", "source": "COPD p.17 · 10/12 강의 01:27:24", "emphasis": true, "lecture": "copd"}, {"id": "copd-m05", "type": "mcq", "stem": "지난 1년간 COPD 급성악화로 1회 입원했던 환자가 현재 안정기이다. 혈중 호산구는 350/mm³이다. 국내 지침(2024)의 안정 시 약물 단계치료에 따른 약제로 옳은 것은?", "choices": ["ICS+LABA+LAMA", "LABA+LAMA", "ICS+LABA", "LAMA 단독", "LABA+LAMA+PDE4 억제제"], "answer": 0, "explanation": "입원 악화 1회 이상이면 고위험군이고, 고위험군 + 혈중 호산구 ≥ 300/mm³이면 처음부터 ICS 포함 3제(ICS+LABA+LAMA)를 쓴다. LABA+LAMA는 저위험군 전체와 고위험군 중 호산구 < 300일 때의 약제이고, PDE4 억제제는 치료 중 악화가 생겼을 때의 단계치료(p.19)에서 등장한다.", "source": "COPD p.18 · 10/12 강의 01:28:23", "emphasis": true, "lecture": "copd"}, {"id": "copd-m06", "type": "mcq", "stem": "고위험군 COPD 환자가 유지치료 중 악화를 겪었다. 혈중 호산구는 450/mm³이다. 국내 지침(2024)의 '악화 시 약물 단계치료'에 따른 약제 조합으로 옳은 것은?", "choices": ["LABA+LAMA ± PDE4i ± 마크롤라이드(호산구와 무관하게 ICS 추가 없음)", "ICS+LABA+LAMA ± PDE4i ± 마크롤라이드(생물학적 제제는 추가하지 않고 유지)", "ICS+LABA+LAMA + Anti-IL-4R(dupilumab) ± PDE4i ± 마크롤라이드", "ICS+LABA+LAMA + 메틸잔틴(테오필린·아미노필린) 정맥투여 ± 마크롤라이드", "LABA+LAMA + 전신 스테로이드 장기 유지 ± PDE4i ± 마크롤라이드"], "answer": 2, "explanation": "고위험군 악화 + 호산구 ≥ 300/mm³ 칸에서만 생물학적 제제 Anti-IL-4R(dupilumab)이 3제에 추가된다. 생물학적 제제 없는 ICS+LABA+LAMA ± PDE4i ± 마크롤라이드는 고위험군 100 ≤ 호산구 < 300 칸, LABA+LAMA ± PDE4i ± 마크롤라이드는 고위험군 호산구 < 100 또는 저위험군 호산구 < 300 칸이며, 메틸잔틴 정맥투여와 전신 스테로이드 장기 투여는 권고되지 않는다(p.28).", "source": "COPD p.19 · 10/12 강의 01:29:45", "emphasis": true, "lecture": "copd"}, {"id": "copd-m07", "type": "mcq", "stem": "COPD 급성악화로 중환자실에 입실한 환자에게 산소를 투여하고 있다. 국내 지침(2024) 기준 목표 산소포화도(SpO2)는?", "choices": ["85–88%", "88–92%", "93–95%", "94–98%", "96% 이상"], "answer": 1, "explanation": "COPD 급성악화의 목표 SpO2는 88–92%로, 2010년 RCT(Austin et al.)에서 이 범위로 맞춘 군이 고농도 산소군보다 사망률이 약 58% 낮았다(교수 설명). 93–95%는 천식 급성악화 목표(천식 강의 p.38), 92~95%는 ARDS 삽관 직후 목표(ARDS 강의 p.22)라서 이와 혼동하는 것이 함정이다.", "source": "COPD p.20 · ASTHMA p.38 · ARDS p.22 · 10/12 강의 01:30:20", "emphasis": true, "lecture": "copd"}, {"id": "copd-m08", "type": "mcq", "stem": "COPD 급성악화의 약물치료에 대한 설명으로 옳지 않은 것은?", "choices": ["속효성 β2 작용제(SABA)를 단독 또는 속효성 항콜린제(SAMA)와 함께 가장 먼저 사용한다", "네뷸라이저와 정량식 흡입기(MDI, 정량흡입기) 사이의 FEV1 개선 효과 차이는 없다", "전신 스테로이드는 경구 투여가 주사와 동등하게 효과적이다", "화농성 객담 증가는 세균감염의 임상적 징후로 항생제 사용 판단에 쓴다", "기관지확장 효과를 더하기 위해 테오필린·아미노필린 정맥투여를 함께 권고한다"], "answer": 4, "explanation": "메틸잔틴계(테오필린, 아미노필린) 정맥투여는 치료역이 좁고 부작용이 심각해 급성악화에서 권고하지 않는다. 메틸잔틴은 p.16 기관지확장제 분류에 들어 있어 '기관지확장제니까 써도 된다'고 착각하기 쉽다. 천식 강의의 'SABA 단독 금지'(p.28)는 천식 조절·완화 전략 얘기라 COPD 급성악화의 SABA 우선 사용과 무관하다.", "source": "COPD p.28 · ASTHMA p.28 · 10/12 강의 01:40:17", "emphasis": true, "lecture": "copd"}, {"id": "copd-m09", "type": "mcq", "stem": "COPD 환자에게 적용하는 금연 5A 전략의 순서로 옳은 것은?", "choices": ["Ask → Advise → Assess → Assist → Arrange", "Ask → Assess → Advise → Assist → Arrange", "Advise → Ask → Assess → Arrange → Assist", "Ask → Advise → Assist → Assess → Arrange", "Assess → Ask → Advise → Assist → Arrange"], "answer": 0, "explanation": "5A는 Ask(매 방문 흡연 상태를 묻고 기록) → Advise(명료하고 강하게 금연 권고) → Assess(금연 의지 확인, 금연 시점 상의) → Assist(상담·행동요법·약물요법으로 도움) → Arrange(추적관찰 예약) 순이다. 철자가 비슷한 Assess(사정)와 Assist(도움)의 순서를 바꾸는 것이 대표 함정이다. 강의 녹취에서 3단계가 '어시스트'로 들리는 부분(01:34:44)은 Assess(사정)를 말한 것이며, 순서는 슬라이드 p.22 기준이다.", "source": "COPD p.22 · 10/12 강의 01:34:25", "emphasis": true, "lecture": "copd"}, {"id": "copd-m10", "type": "mcq", "stem": "COPD 환자의 호흡재활에 대한 설명으로 옳은 것은?", "choices": ["운동능력 향상과 생존 이득은 진행된 병기의 중증 환자에게서만 확인되었다", "증상만 완화할 뿐 생존율을 높인다는 근거는 없다", "운동훈련에서는 근력운동이 가장 중요하고 유산소운동은 보조적으로만 시행한다", "유산소운동을 최대운동능력 60% 이상, 20~60분, 주 3~5회 권고한다", "영양상담에서는 저체중만 문제가 되므로 체중 증가에 초점을 두고 상담한다"], "answer": 3, "explanation": "운동훈련에서는 유산소운동이 가장 중요하며 최대운동능력의 60% 이상, 20~60분, 주 3~5회가 권고된다. 호흡재활은 모든 병기의 COPD 환자에서 운동능력 향상·증상 완화와 함께 생존율을 높이고(p.23), 영양상담은 과체중·저체중 모두를 다룬다. 교수는 흡입 기관지확장제·스테로이드와 달리 운동은 생존율 증가가 밝혀져 있다고 설명했다(01:35:23).", "source": "COPD p.23 · 10/12 강의 01:35:40", "emphasis": true, "lecture": "copd"}, {"id": "copd-m11", "type": "mcq", "stem": "COPD 급성악화 환자의 비침습적 기계환기(NIV)에 대한 설명으로 옳은 것은?", "choices": ["의식 저하가 있거나 가래를 배출할 수 없는 환자가 NIV의 가장 좋은 적응증이다", "천식과 달리 COPD에서는 NIV의 효과 근거가 잘 확립되어 있어 급성악화 시 많이 사용한다", "NIV 적응증(호흡산증, 심한 호흡곤란, 산소치료에도 지속되는 저산소혈증)을 모두 충족해야 시행한다", "적절한 산소공급과 NIV에도 pH < 7.25가 지속되는 것이 NIV를 시작하는 기준이다", "호흡보조근 사용이나 역설적 복부운동이 관찰되면 NIV는 금기이다"], "answer": 1, "explanation": "천식은 NIV 효과가 명확하지 않지만 COPD는 NIV 효과 근거가 확립되어 있으며, Take home(p.32)에서도 'NIV가 효과적'으로 반복된다. 의식 저하·가래 배출 불가는 침습적 기계환기 적응증(p.30)이고, NIV 적응증은 '다음 중 한 가지'만 해당해도 되며, 산소·NIV에도 pH < 7.25가 지속되는 것은 ICU 치료 적응증이고, 보조근 사용·역설적 복부운동은 오히려 NIV 적응증이다.", "source": "COPD p.29–30 · ASTHMA p.40 · 10/12 강의 01:41:49", "emphasis": true, "lecture": "copd"}, {"id": "copd-m12", "type": "mcq", "stem": "폐활량측정법을 이용한 COPD 진단에 대한 설명으로 옳은 것은?", "choices": ["기관지확장제 투여 전 FEV1/FVC < 0.70이면 확진한다", "기관지확장제 투여 후 FEV1/FVC < 0.75~0.80이고 심한 폐기능 변동이 있어야 확진한다", "고정값 0.70은 젊은 성인에서 과진단, 노인에서 과소진단될 수 있다", "GOLD 1~4 등급은 FEV1/FVC 비율의 크기로 나눈다", "기관지확장제 투여 후 FEV1/FVC < 0.70이면 기류제한이 있다고 확진한다"], "answer": 4, "explanation": "기관지확장제 투여 후 FEV1/FVC < 0.70이면 기류제한을 확진하며 국내·국제 지침이 같다. < 0.75~0.80 + 심한 폐기능 변동은 천식 기준이고, 고정값 0.70은 젊은 성인 과소진단·노인 과진단으로 방향이 반대이며, GOLD 등급은 FEV1 %예측치로 나눈다.", "source": "COPD p.13", "emphasis": false, "lecture": "copd"}, {"id": "copd-m13", "type": "mcq", "stem": "COPD의 발병 기전과 병태생리에 대한 설명으로 옳지 않은 것은?", "choices": ["금연하면 호흡기계의 이상 염증반응은 곧바로 소실된다", "단백분해효소 증가로 폐실질 결합조직의 엘라스틴이 파괴되어 폐기종이 생긴다", "기관지 주변과 사이질 섬유화는 소기도 장애와 폐쇄에 기여한다", "기류제한과 폐과다팽창은 심장기능에 영향을 준다", "혈중 염증매개물질 증가는 허혈성 심질환·당뇨병 등 동반질환의 발생·악화에 관여한다"], "answer": 0, "explanation": "슬라이드는 금연 이후에도 염증반응이 지속된다고 명시한다(교수 설명: 남아 있는 유해물질 때문). 나머지는 단백분해효소-엘라스틴 파괴에 의한 폐기종, 섬유화에 의한 소기도 폐쇄, 과팽창에 의한 심장기능 영향, 염증매개물질에 의한 동반질환으로 모두 맞는 설명이다.", "source": "COPD p.9", "emphasis": false, "lecture": "copd"}, {"id": "copd-m14", "type": "mcq", "stem": "COPD 급성악화가 의심되는 환자: 호흡곤란 VAS 7, 호흡수 28회/분, 맥박 110회/분, 안정 시 실내공기 SpO2 89%, CRP 4 mg/L. ABGA는 pH 7.30, PaCO2 62 mmHg이다. 로마 제안(Rome proposal)에 따른 중증도는?", "choices": ["경증 – CRP가 10 mg/L 미만이라 5개 지표를 모두 넘지 않으므로", "중등증 – 5개 지표 중 4개를 충족하고 SpO2가 92% 미만이므로", "중증 – 중등증 기준 충족 + ABGA 고탄산혈증·산증이 있으므로", "중등증 – 고탄산혈증은 중등증에서도 나타날 수 있으므로", "판정 불가 – 기존 분류처럼 투여한 치료를 먼저 확인해야 하므로"], "answer": 2, "explanation": "VAS ≥ 5, 호흡수 ≥ 24, 맥박 ≥ 95, SpO2 < 92%로 5개 중 3개 이상을 충족해 중등증 기준을 만족하고, ABGA에서 PaCO2 > 45 & pH < 7.35가 확인되어 중증이다. 중등증에서도 고탄산혈증은 있을 수 있지만 산증(pH 저하)은 없어야 하므로 이를 놓치는 것이 함정이다.", "source": "COPD p.25", "emphasis": false, "lecture": "copd"}, {"id": "copd-m15", "type": "mcq", "stem": "COPD 평가검사(CAT)에 대한 설명으로 옳은 것은?", "choices": ["호흡곤란 정도만 0~4점 척도로 평가하는 단일 문항 도구이다", "총점이 낮을수록 COPD 관련 건강 상태가 나쁜 것으로 해석한다", "총점이 10점 미만이면 증상이 심하다고 판단하는 컷오프를 쓴다", "8개 항목(각 0~5점), 수면·자신감 등 호흡곤란 외 영역도 포함", "질병 경과 판단보다는 초기 진단을 확정할 때 주로 사용하는 도구이다"], "answer": 3, "explanation": "CAT은 8개 항목을 각 0~5점으로 평가하는 삶의 질 도구로, 점수가 높을수록 나쁘며 호흡곤란 외에 호흡기 증상, 일상생활 활동, 수면, 자신감 등을 포함한다. 총점이 10점보다 높으면 증상이 심하다고 판단하고(p.15), 초기 진단보다 질병 경과 판단에 주로 쓴다(01:21:55). 호흡곤란만 0~4점으로 보는 것은 mMRC다.", "source": "COPD p.15 · 10/12 강의 01:22:01", "emphasis": false, "lecture": "copd"}, {"id": "copd-m16", "type": "mcq", "stem": "COPD 환자 교육과 급성악화 후 퇴원 관리에 대한 설명으로 옳은 것은?", "choices": ["일방적인 지식 전달 교육만으로도 자가관리 기술이 충분히 향상된다", "임종 관련 내용도 교육 주제에 포함해 임종 시 치료 방향 결정을 돕는다", "흡입기 사용법은 처음 처방할 때 한 번 교육하면 이후 사용 확인은 필요 없다", "짧은 금연 권고는 효과가 없어 30분 이상의 집중 상담만 권고된다", "급성악화로 퇴원한 환자의 추적관찰은 6개월 이후에 계획한다"], "answer": 1, "explanation": "COPD 환자 교육 주제에는 금연, 질병 정보, 치료, 호흡곤란 감소법, 악화 대비 자가치료와 함께 임종 관련 내용이 들어가며, 임종에 대한 논의는 임종 시 치료 방향 결정에 도움이 된다(p.21). 일방적 지식 전달만으로는 자가관리 기술 향상이 부족하다. 흡입기는 교육으로 끝내지 말고 꾸준히 제대로 쓰는지 확인해야 한다(교수 강조: 순응도가 낮으면 증상조절 실패·악화·삶의 질 저하·사망 위험 증가). 의료진의 3분 정도 짧은 금연 권고만으로도 금연율이 높아지고(p.22), 급성악화 퇴원 후 추적은 빠르면 4주, 늦어도 12주 이내다(p.31).", "source": "COPD p.21–22, 31 · 10/12 강의 01:34:10", "emphasis": true, "lecture": "copd"}, {"id": "copd-m17", "type": "mcq", "stem": "COPD 급성악화 환자의 동맥혈가스(ABGA) 기준값과 판단의 연결로 옳은 것은? (국내 지침 2024 기준)", "choices": ["NIV 적응증 – PaCO2 ≥ 45 mmHg 그리고 pH < 7.25", "ICU 치료 적응증 – 산소와 NIV에도 PaO2 < 60 mmHg 지속", "로마 제안 중등증 – PaCO2 > 45 mmHg와 pH < 7.35가 함께 있어도 됨", "로마 제안 중증 – PaCO2 > 45 mmHg 그리고 pH < 7.35", "ICU 치료 적응증 – 산소와 NIV에도 pH < 7.35 지속"], "answer": 3, "explanation": "로마 제안에서 중등증 기준을 충족하면서 ABGA상 고탄산혈증과 산증(PaCO2 > 45 & pH < 7.35)이 확인되면 중증이다. 중등증은 저산소·고탄산혈증은 있을 수 있어도 산증은 없어야 하고(pH > 7.35), NIV 적응증의 호흡산증은 pH ≤ 7.35 또는 PaCO2 ≥ 45 mmHg, ICU 치료 적응증은 산소+NIV에도 PaO2 < 40 mmHg 또는 pH < 7.25가 지속·악화될 때다.", "source": "COPD p.25, 29 · 10/12 강의 01:38:12", "emphasis": false, "lecture": "copd"}, {"id": "copd-s01", "type": "short", "stem": "간호정보조사에서 현재 흡연 여부만 확인하면 COPD 고위험군을 놓칠 수 있다. 현재 비흡연자에게도 반드시 확인해야 하는 흡연 관련 정보는?", "answer": "과거 흡연력", "accept": ["과거 흡연력", "과거흡연력", "과거 흡연", "과거흡연", "과거 흡연 여부", "과거 흡연 이력", "흡연 과거력", "과거력", "과거에 흡연했는지", "과거 흡연 경험", "이전 흡연력", "흡연 경험 여부", "금연 여부(과거 흡연자)", "past smoking history", "former smoking", "ex-smoking"], "explanation": "슬라이드의 COPD 의심 지표는 '현재 흡연력 또는 과거 흡연력'이며, 교수는 현재 흡연만 묻지 말고 과거력까지 꼭 물어야 한다고 두 번 강조했다. 현재 비흡연자라고 위험군에서 빼면 고위험군을 놓친다. 흡연량(갑년)도 중요하지만 이 문항이 묻는 것은 과거 흡연 여부다.", "source": "COPD p.11 · 10/12 강의 01:12:35, 01:16:39", "emphasis": true, "lecture": "copd"}, {"id": "copd-s02", "type": "short", "stem": "유지치료 중 악화가 생긴 고위험군 COPD 환자에서 혈중 호산구가 몇 /mm³ 미만이면 ICS 이득이 거의 없어 LABA+LAMA를 유지하는가? (숫자)", "answer": "100", "accept": ["100", "100/mm3", "100/mm³", "100 /mm3", "100개", "100 미만", "<100", "100 cells/μL", "100 cells/uL", "100/µL", "100 cells/µL", "100개/mm3"], "explanation": "악화 시 단계치료에서 고위험군은 호산구 < 100 / 100~300 / ≥ 300의 3구간으로 나뉘며, < 100에서는 ICS 효과가 거의 없어 LABA+LAMA ± PDE4i ± 마크롤라이드를 쓴다. 300은 안정 시 3제 문턱이므로 두 숫자를 섞지 않는다.", "source": "COPD p.19 · 10/12 강의 01:29:45", "emphasis": true, "lecture": "copd"}, {"id": "copd-s03", "type": "short", "stem": "급성악화를 경험한 COPD 환자는 다음에도 급성악화가 생기기 쉬워 향후 악화 발생을 예측하는 가장 중요한 인자로 꼽힌다. 이런 환자를 무엇이라 하는가?", "answer": "잦은 악화자", "accept": ["잦은 악화자", "잦은악화자", "잦은 급성악화자", "빈번한 악화자", "frequent exacerbator", "frequent exacerbators", "잦은 악화 표현형", "frequent exacerbator phenotype", "빈번 악화자", "잦은 악화 환자"], "explanation": "지난 1년간의 급성악화력이 다음 악화의 가장 중요한 예측인자이므로 국내·GOLD 분류 모두 악화력을 축으로 한다. GOLD 2026은 악화 1회 이상이면 E군으로, 교수는 이를 올해 개정된 업데이트로 강조했다.", "source": "COPD p.26 · 10/12 강의 01:39:16", "emphasis": true, "lecture": "copd"}, {"id": "copd-s04", "type": "short", "stem": "국내 지침(2024)에서 비흡연 COPD의 가장 중요한 위험인자로 꼽는 과거 병력은?", "answer": "결핵", "accept": ["결핵", "결핵 과거력", "결핵 병력", "폐결핵", "폐결핵 과거력", "폐결핵 병력", "결핵 기왕력", "결핵 감염력", "tuberculosis", "pulmonary tuberculosis", "TB", "Tbc"], "explanation": "국내는 폐결핵 유병률이 높아 감염(결핵)에 의한 COPD가 임상적으로 중요하며, 결핵 과거력이 비흡연 COPD의 가장 중요한 인자다(강의에서 3회 반복). 유전적 인자인 알파-1 항트립신 결핍증과 혼동하지 않는다.", "source": "COPD p.7", "emphasis": false, "lecture": "copd"}, {"id": "copd-s05", "type": "short", "stem": "COPD 급성악화 시 전신 스테로이드는 프레드니솔론 기준 하루 몇 mg을 5일간 사용하도록 권고되는가? (숫자)", "answer": "40", "accept": ["40", "40 mg", "40mg", "하루 40 mg", "40 mg/일", "40mg/day"], "explanation": "프레드니솔론 기준 하루 40 mg × 5일이 권고되며 경구는 주사와 동등하게 효과적이다. 장기 투여는 폐렴 발생률과 사망률을 높일 수 있어 명확한 악화 환자에 국한한다.", "source": "COPD p.28", "emphasis": false, "lecture": "copd"}, {"id": "copd-s06", "type": "short", "stem": "COPD의 유전적 위험인자로 제시된 선천성 결핍증의 이름은?", "answer": "알파-1 항트립신 결핍증", "accept": ["알파-1 항트립신 결핍증", "알파-1 항트립신", "알파1 항트립신 결핍증", "알파1항트립신", "α1-항트립신 결핍증", "알파-1 안티트립신 결핍증", "알파1 안티트립신", "α1-antitrypsin deficiency", "alpha-1 antitrypsin deficiency", "alpha-1 antitrypsin", "AATD", "AAT 결핍증", "A1AT 결핍"], "explanation": "COPD 위험인자 중 유전적 인자는 선천성 알파-1 항트립신 결핍증과 가족력이다. 젊을 때 FEV1이 낮은 '폐 성장 이상'은 별도의 위험인자 항목이므로 섞지 않는다.", "source": "COPD p.7", "emphasis": false, "lecture": "copd"}, {"id": "copd-s07", "type": "short", "stem": "증상악화 병력이 있고 만성기관지염을 동반한 중증 COPD에서 기관지확장제의 부가 유지요법제로 쓰는 경구 선택적 PDE-4 억제제의 성분명은?", "answer": "로플루밀라스트", "accept": ["로플루밀라스트", "roflumilast", "Roflumilast", "로플루밀라스트(닥사스)"], "explanation": "로플루밀라스트(닥사스 0.5 mg)는 선택적 PDE-4 억제제로, 기관지확장제가 아니라 항염 효과를 내는 경구 유지요법제다. 급성악화 당시 증상을 조절하는 약이 아니라는 점이 함정이다.", "source": "COPD p.16", "emphasis": false, "lecture": "copd"}, {"id": "copd-s08", "type": "short", "stem": "COPD의 기류제한은 소기도 질환과 무엇의 복합 작용으로 생기는가? (COPD 강의 p.4)", "answer": "폐실질 파괴(폐기종)", "accept": ["폐실질 파괴(폐기종)", "폐실질 파괴", "폐 실질 파괴", "폐실질파괴", "폐기종", "폐실질 손상", "폐포 파괴", "폐포벽 파괴", "폐기종(폐실질 파괴)", "emphysema", "parenchymal destruction"], "explanation": "기류제한은 소기도 질환(만성염증 → 섬유화 → 기도 협착)과 폐실질 파괴(폐기종: 탄성 감소로 호기 때 기도가 열려 있지 못함)의 복합 작용이며 p.4와 p.32에서 반복된다. 천식의 가변적 기류제한과 달리 COPD는 비가역적이다. 폐기종의 탄성(반동) 감소는 순응도↑와 같은 현상이다(구조와기능 p.20).", "source": "COPD p.4", "emphasis": false, "lecture": "copd"}, {"id": "asthma-m01", "type": "mcq", "stem": "천식 진단을 위한 기관지확장제 가역반응 검사(salbutamol 200–400 mcg 흡입 10–15분 후 재측정)에서 '양성'으로 판정하는 기준으로 옳은 것은?", "choices": ["FEV1이 기저치 대비 12% 초과 또는 200 mL 초과 증가", "FEV1이 기저치 대비 12% 초과 그리고 200 mL 초과 증가", "FEV1이 기저치 대비 10% 초과 그리고 200 mL 초과 증가", "FEV1/FVC가 0.70 이상으로 회복", "PEF가 기저치 대비 20% 초과 증가"], "answer": 1, "explanation": "가역반응 양성은 FEV1이 12% 초과 그리고 200 mL 초과 증가해 두 조건을 모두 만족해야 한다(>15% & >400 mL면 더 신뢰). '또는'으로 바꾼 보기와, 운동 유발검사(>10% & >200 mL 감소)·4주 치료 후 PEF(>20% 증가) 기준을 섞은 보기가 함정이다.", "source": "ASTHMA p.13, p.16 · 10/12 강의 00:12:39", "emphasis": true, "lecture": "asthma"}, {"id": "asthma-m02", "type": "mcq", "stem": "기관지확장제 가역반응 검사 오더가 난 환자에게 검사 전 흡입제를 중단해야 하는 최소 시간을 바르게 짝지은 것은? (SABA / 1일 2회 LABA / 1일 1회 LABA 순)", "choices": ["4시간 / 12시간 / 24시간", "6시간 / 24시간 / 48시간", "4시간 / 36시간 / 24시간", "4시간 / 24시간 / 36시간", "8시간 / 24시간 / 36시간"], "answer": 3, "explanation": "검사 전 SABA는 최소 4시간, 1일 2회 LABA는 24시간 이상, 1일 1회 LABA는 36시간 이상 중단한다(작용이 긴 약일수록 길게). 벤토린을 평소대로 주고 검사하면 가역성을 알 수 없으므로 검사 오더가 나면 흡입제 투약 스케줄을 확인하는 것이 간호 포인트이며, 24와 36을 뒤바꾼 보기가 함정이다.", "source": "ASTHMA p.16 · 10/12 강의 00:19:20", "emphasis": true, "lecture": "asthma"}, {"id": "asthma-m03", "type": "mcq", "stem": "천식 진단 기준(2022 국내 지침)에 대한 설명으로 옳은 것은?", "choices": ["기도과민성이 확인되면 호흡기 증상 병력이 없어도 천식으로 진단한다", "성인에서 다른 호흡기 증상 없이 기침만 지속되면 천식 가능성이 높다", "가변적 호흡기 증상의 병력과 가변적 호기 기류제한의 객관적 확인을 모두 만족해야 한다", "호기 기류제한은 기관지확장제 투여 후 FEV1/FVC <0.70으로 정의한다", "기관지확장제 반응이 12% 미만이면 천식을 배제할 수 있다"], "answer": 2, "explanation": "천식 진단은 ① 두 가지 이상의 가변적 호흡기 증상 병력과 ② 가변적 호기 기류제한(FEV1/FVC <0.75–0.8 감소 + 심한 폐기능 변동)을 동시에 확인해야 한다. 기도과민성은 필수조건이 아니고, 성인에서 기침만 있으면 천식은 드물며, <0.70은 COPD 기준이고, 반응이 12% 미만이어도 천식을 배제할 수 없다(증상 있을 때 반복 검사).", "source": "ASTHMA p.15–16 · 10/12 강의 00:16:19", "emphasis": true, "lecture": "asthma"}, {"id": "asthma-m04", "type": "mcq", "stem": "폐기능 변동을 증명하는 검사와 양성 기준을 바르게 연결한 것은?", "choices": ["2주 이상 PEF 측정 – 평균 일중 PEF 변동 >20%", "운동 유발검사 – 운동 후 FEV1 ≥20% 감소", "만니톨 흡입 기관지유발검사 – FEV1 ≥20% 감소", "4주 이상 항염증 치료 후 – PEF >10% 증가", "메타콜린 흡입 기관지유발검사 – FEV1 ≥20% 감소"], "answer": 4, "explanation": "메타콜린 흡입 후 FEV1 ≥20% 감소가 기관지유발검사 양성이다. PEF 일중 변동은 >10%, 운동 유발은 FEV1 >10% & >200 mL 감소, 만니톨·고장성 식염수·과호흡은 ≥15% 감소, 4주 치료 후 호전은 FEV1 >12% & >200 mL 또는 PEF >20% 증가로, 기준 숫자를 서로 바꾼 것이 함정이다.", "source": "ASTHMA p.16 · 10/12 강의 00:19:44", "emphasis": true, "lecture": "asthma"}, {"id": "asthma-m05", "type": "mcq", "stem": "천식 표현형(phenotype)과 흡입스테로이드(ICS) 반응에 대한 설명으로 옳은 것은?", "choices": ["알레르기천식은 유년기에 시작하고 호산구성 염증이 많아 ICS에 잘 반응한다", "비알레르기천식은 호산구성 염증이 주로 나타나 ICS에 가장 잘 반응한다", "성인발병천식은 주로 남성에서 생기며 대부분 알레르기성이다", "비만 동반 천식은 증상은 가볍지만 호산구성 염증이 심하다", "지속적 기류제한 동반 천식은 기도개형이 없어 가역성이 완전하다"], "answer": 0, "explanation": "알레르기천식은 유년기 시작·아토피력·호산구성 염증이 특징이고 ICS에 잘 반응한다. 비알레르기천식은 ICS에 잘 반응하지 않고, 성인발병천식은 여성·대부분 비알레르기성이며 직업성 천식 감별이 필요하고, 비만 동반 천식은 증상은 심하나 호산구성 염증은 적다.", "source": "ASTHMA p.12 · 10/12 강의 00:10:42", "emphasis": true, "lecture": "asthma"}, {"id": "asthma-m06", "type": "mcq", "stem": "천식과 COPD 감별표에서 천식보다 COPD에 가까운 소견은?", "choices": ["20세 이전에 증상이 시작되었다", "증상이 없는 시기에는 폐활량검사가 정상이다", "흉부 X선에서 심한 과팽창이 보인다", "기관지확장제나 ICS 치료로 수주에 걸쳐 호전된다", "천식이나 다른 알레르기 질환의 가족력이 있다"], "answer": 2, "explanation": "감별표에서 흉부 X선은 천식이 대체로 정상, COPD는 심한 과팽창이다. COPD 쪽 항목은 그 밖에 40세 이후 발생, 흡연·생체연료 노출력, 증상 사이에도 비정상인 폐기능, 기관지확장제 후에도 지속되는 기류제한이다. 나머지 보기는 모두 '천식에 가까움' 쪽 항목이며, 한쪽에 3가지 이상 해당하면 그 진단을, 양쪽 수가 비슷하면 ACO를 고려한다.", "source": "ASTHMA p.17–18 · 10/12 강의 00:22:09", "emphasis": true, "lecture": "asthma"}, {"id": "asthma-m07", "type": "mcq", "stem": "아스피린 과민성 천식의 기전으로 옳은 것은?", "choices": ["아스피린이 5-lipoxygenase를 차단해 류코트리엔 생성이 감소한다", "아스피린이 COX를 차단하면 아라키돈산 대사 전체가 억제되어 PGE2와 류코트리엔이 함께 감소한다", "아스피린이 COX를 차단해 항염 작용의 PGE2가 증가한다", "아스피린이 류코트리엔 수용체를 직접 자극해 기관지가 수축한다", "아스피린이 COX를 차단해 아라키돈산이 5-LO 경로로 몰리면서 류코트리엔이 증가한다"], "answer": 4, "explanation": "막 인지질에서 생긴 아라키돈산은 COX 경로(PGD2·PGF2α 염증성 / PGE2 항염)와 5-LO 경로(LTA4 → LTC4·D4·E4)로 나뉘는데, 아스피린이 COX를 막으면 아라키돈산이 5-LO 경로로 쏠려 류코트리엔이 늘고 항염성 PGE2는 줄어 시소가 pro-inflammatory 쪽으로 기운다. 그래서 류코트리엔 조절제가 아스피린 과민성 천식에 특히 도움이 된다. 차단 효소를 5-LO로 바꾼 보기, COX만 막혀도 대사 전체가 줄어든다고 한 보기(실제로는 5-LO 쪽으로 쏠림)가 함정이다.", "source": "ASTHMA p.9, p.24", "emphasis": false, "lecture": "asthma"}, {"id": "asthma-m08", "type": "mcq", "stem": "흡입스테로이드(ICS)와 흡입지속성베타작용제(LABA)에 대한 설명으로 옳지 않은 것은?", "choices": ["ICS는 지속성 천식 치료제 중 가장 효과적인 항염증약제다", "ICS는 천식 악화의 빈도와 천식으로 인한 사망을 줄인다", "LABA는 ICS를 대체할 수 없으므로 항상 ICS와 함께 사용한다", "ICS는 천식을 완치시키므로 증상이 없어지면 중단해도 재악화가 드물다", "ICS의 구인두 캔디다증은 흡입 후 구강 세척과 MDI 사용 시 spacer로 줄일 수 있다"], "answer": 3, "explanation": "ICS는 천식에서 가장 중요한 약물이지만 완치시키지는 못하며, 상당수 환자에서 중단하면 수주~수개월 내 재악화된다. 나머지는 모두 슬라이드 내용이며, LABA 단독 사용 금지(항상 ICS와 함께)도 교수가 결론으로 강조한 포인트다.", "source": "ASTHMA p.21–23 · 10/12 강의 00:28:04", "emphasis": true, "lecture": "asthma"}, {"id": "asthma-m09", "type": "mcq", "stem": "천식 약물과 주의할 부작용·적용 원칙을 연결한 것으로 옳지 않은 것은?", "choices": ["류코트리엔 조절제(montelukast) – 자살충동·환각 등 정신건강 부작용 가능성을 설명한다", "생물학적 치료제 – 고비용이므로 표현형·IgE level·호산구 수를 종합 판단해 단계별 치료 3단계부터 적용한다", "메틸잔틴(theophylline) – 구역·구토와 함께 부정맥·경련발작이 생길 수 있다", "항IgE 항체(omalizumab) – 드물게 아나필락시스가 생기며 대부분 투여 후 2시간 이내 발생한다", "흡입지속성항콜린제(LAMA, tiotropium) – β작용제로 부정맥·진전이 있는 환자에서 대체 기관지확장제로 쓴다"], "answer": 1, "explanation": "생물학적 치료제는 2–4주마다 주사하는 고비용 약제라 표현형·IgE level·호산구 수 등을 종합 판단해 적용하는 것은 맞지만, 단계별 치료에서는 3단계가 아니라 5단계 옵션(표현형에 따른 치료: anti-IgE·anti-IL5/5R·anti-IL4R)이다. 나머지 연결은 모두 슬라이드 내용이며, 항IgE 투여 후 아나필락시스(약 0.2%)는 대부분 2시간 이내라 투여 후 관찰이 필요하다. LAMA(지속성)는 급성악화에 쓰는 ipratropium(SAMA, 속효성)과 구분한다.", "source": "ASTHMA p.24–26, p.28", "emphasis": false, "lecture": "asthma"}, {"id": "asthma-m10", "type": "mcq", "stem": "국내 지침 단계별 치료 2안에서 증상이 월 2회 미만인 1단계 환자의 치료로 옳은 것은?", "choices": ["SABA를 사용할 때마다 저용량 ICS를 함께 흡입한다", "필요할 때 SABA만 단독으로 흡입한다", "저용량 ICS를 매일 유지한다", "저용량 ICS-LABA를 매일 유지한다", "필요할 때 저용량 ICS-formoterol을 흡입한다"], "answer": 0, "explanation": "2안 1단계(증상 월 2회 미만)는 SABA를 쓸 때마다 저용량 ICS를 함께 흡입하며, 핵심은 SABA를 단독으로 쓰지 않는 것이다. 저용량 ICS 유지는 2안 2단계, 저용량 ICS-LABA 유지는 2안 3단계, 필요시 저용량 ICS-formoterol은 1안 1–2단계 치료다.", "source": "ASTHMA p.28 · 10/12 강의 00:37:44", "emphasis": true, "lecture": "asthma"}, {"id": "asthma-m11", "type": "mcq", "stem": "단계별 치료 1안(증상완화제 = 필요시 저용량 ICS-formoterol)에 대한 설명으로 옳은 것은?", "choices": ["GINA는 SABA 단독 사용의 위험과 더 나은 outcome을 근거로 1안을 더 추천한다", "국내 지침은 1안 2단계 사용을 금지하고 2안만 허용한다", "국내 지침은 1안이 외래 추적관찰과 폐기능검사 시행을 늘린다고 본다", "1안은 단계가 올라가면 증상완화제를 SABA로 바꾼다", "formoterol은 LABA이므로 1안에서도 증상완화제로는 쓰지 않는다"], "answer": 0, "explanation": "GINA는 SABA 단독 흡입의 위험과 1안의 더 좋은 outcome을 근거로 1안을 선호한다. 국내 지침은 1안 2단계에 '순응도 저하·경과 관찰의 어려움' 단서를 달았을 뿐 금지하지 않았고(필요할 때만 흡입하면 병원에 오지 않아 폐기능검사·흡입기 확인이 어려움), 1안의 완화제는 모든 단계에서 필요시 저용량 ICS-formoterol로 같다(formoterol은 작용이 빨라 완화제로 쓸 수 있음). 약물 강의 p.8은 LABA를 질병조절제로만 분류하지만 formoterol은 그 예외다.", "source": "ASTHMA p.28, p.41 · DRUG p.8 · 10/12 강의 00:38:15", "emphasis": true, "lecture": "asthma"}, {"id": "asthma-m12", "type": "mcq", "stem": "지난 4주간 다음과 같은 천식 환자의 조절 정도는? — 낮 동안 증상 주 4회, 증상완화제(SABA) 주 3회 사용, 천식으로 인한 야간 수면 방해 없음, 활동 제한 없음", "choices": ["조절 천식 (해당 0개)", "일부 조절 천식 (해당 2개)", "일부 조절 천식 (해당 3개)", "조절되지 않는 천식 (해당 2개)", "조절되지 않는 천식 (해당 3–4개)"], "answer": 1, "explanation": "증상 조절 평가 4항목(주간 증상 주 3회 이상, 야간수면 방해, SABA 주 3회 이상 사용, 활동 제한) 중 주간 증상과 SABA 사용 2개에 해당하므로 일부 조절 천식이다. 0개 = 조절 천식, 1–2개 = 일부 조절 천식, 3–4개 = 조절되지 않는 천식이며, 기준이 '주 3회 이상'이므로 SABA 주 3회도 해당한다는 점과 2개는 아직 '일부 조절'이라는 점이 함정이다.", "source": "ASTHMA p.32 · 10/12 강의 00:43:02", "emphasis": true, "lecture": "asthma"}, {"id": "asthma-m13", "type": "mcq", "stem": "응급실에 온 천식 급성악화 환자가 처음보다 천명이 줄었으나 졸려하고 청진상 호흡음이 감소해 있다. 우선 조치로 옳은 것은?", "choices": ["천명이 줄었으므로 호전 중으로 보고 경구 스테로이드만 유지한다", "PEF를 측정해 경증·중등증과 중증 중 어디인지 먼저 분류한다", "중증도 분류 없이 즉시 SABA와 산소를 주고 중환자실 의뢰·기관삽관을 고려한다", "NIV를 적용하기 위해 진정제를 투여한다", "ABGA 결과가 나올 때까지 치료를 미루고 관찰한다"], "answer": 2, "explanation": "초기 평가 ABC 후 졸림·혼미·호흡음 감소가 있으면 중증도 분류를 생략하고 즉시 SABA+산소, 중환자실 의뢰, 기관삽관을 고려한다. 의식 저하는 저산소증·고탄산혈증이 이미 진행됐다는 뜻이고 호흡음 감소(silent chest)는 공기 흐름 자체가 없다는 뜻이라, 천명 감소가 오히려 가장 위험한 신호일 수 있다.", "source": "ASTHMA p.37 · 10/12 강의 00:46:34", "emphasis": true, "lecture": "asthma"}, {"id": "asthma-m14", "type": "mcq", "stem": "천식 급성악화의 중증도 분류와 초기 치료에 대한 설명으로 옳은 것은? (2022 국내 지침)", "choices": ["맥박 100–120회/분, SpO2(대기) 90–95%는 중증 악화 소견이다", "PEF가 예측치의 50%를 넘으면 중증 악화로 분류한다", "산소를 투여할 때는 SpO2 88–92%를 목표로 한다", "호흡수 >30회/분, 맥박 >120회/분, SpO2(대기) <90%는 중증 악화 소견이다", "초기 치료 4시간 뒤에 폐기능을 측정해 재평가한다"], "answer": 3, "explanation": "중증 악화는 단어만 말함, 호흡수 >30회/분, 맥박 >120회/분, SpO2 <90%, PEF ≤50%이고, 맥박 100–120·SpO2 90–95%·PEF >50%는 경증·중등증이다. 산소 목표는 93–95%(88–92%는 COPD 목표)이며, 재평가는 초기 치료 1시간 이내에 해서 FEV1·PEF 60–80% & 호전이면 퇴원을 고려한다.", "source": "ASTHMA p.37–38 · COPD p.20 · 10/12 강의 00:47:36", "emphasis": true, "lecture": "asthma"}, {"id": "asthma-m15", "type": "mcq", "stem": "천식 급성악화 환자의 ABGA·흉부 X선에 대한 설명으로 옳은 것은?", "choices": ["모든 급성악화 환자에게 ABGA를 일상적으로 시행한다", "급성악화 중에는 대개 PaCO2가 45 mmHg를 넘는 고탄산혈증이 나타난다", "PaCO2가 40 mmHg 정도로 정상이면 환기가 유지되고 있어 안심할 수 있다", "흉부 X선은 악화 정도를 평가하기 위해 모든 환자에게 촬영한다", "PaO2 <60 mmHg이면서 PaCO2가 정상이거나 45 mmHg를 넘으면 호흡부전이다"], "answer": 4, "explanation": "PaO2 <60 mmHg + PaCO2 정상 또는 상승(특히 >45 mmHg)이면 호흡부전이다. 악화 중 PaCO2는 대개 <40 mmHg이므로 '정상' PaCO2는 안심이 아니라 피로·환기 부전의 신호일 수 있고, ABGA는 PEF·FEV1 <예측치 50%이거나 초기 치료에 반응이 없을 때, 흉부 X선은 기흉·폐렴 등이 의심될 때만 한다.", "source": "ASTHMA p.39 · 10/12 강의 00:50:48", "emphasis": true, "lecture": "asthma"}, {"id": "asthma-m16", "type": "mcq", "stem": "1안(증상완화제 = 필요시 저용량 ICS-formoterol)으로 치료 중인 환자의 지난 4주: 낮 동안 증상 주 4회, 천식으로 인한 야간 수면 방해 있음, 필요시 ICS-formoterol 주 4회 흡입, 활동 제한 없음. 교수가 강의에서 짚은 지침의 예외를 적용할 때 조절 정도와 판단 근거로 옳은 것은?", "choices": ["조절되지 않는 천식 – 완화제 흡입 횟수를 SABA 항목으로 세어 4항목 중 3개 해당", "일부 조절 천식 – 4항목 중 3개 해당", "일부 조절 천식 – SABA 항목을 빼고 나머지 3항목 중 2개 해당", "조절되지 않는 천식 – SABA 항목을 빼고 나머지 3항목 중 2개 해당", "판정 불가 – 1안 환자는 증상 조절 평가 대신 ACT 점수로만 판단"], "answer": 2, "explanation": "1안처럼 ICS-formoterol을 완화제로 쓰면 SABA를 쓰지 않으므로 'SABA 주 3회 이상 사용' 항목을 빼고 나머지 3항목(주간 증상 주 3회 이상, 야간수면 방해, 활동 제한)으로만 판단한다(슬라이드에는 없고 지침 각주, 교수 구두 강조). 이 환자는 주간 증상·야간수면 방해 2개라 일부 조절 천식이다. ICS-formoterol 흡입을 SABA 항목으로 세면 3개가 되어 '조절되지 않음'으로 잘못 판정하게 되는 것이 함정이다.", "source": "ASTHMA p.32 · 10/12 강의 00:43:39", "emphasis": true, "lecture": "asthma"}, {"id": "asthma-m17", "type": "mcq", "stem": "천식 급성악화의 초기 치료와 재평가(2022 국내 지침 그림 5-2, 강의 보충 포함)에 대한 설명으로 옳지 않은 것은?", "choices": ["경증·중등증 악화에는 SABA 흡입과 경구 스테로이드를 쓰고, 흡입속효성항콜린제(ipratropium) 사용을 고려한다", "중증 악화에는 SABA+흡입속효성항콜린제, 전신 스테로이드를 쓰고 정주 마그네슘과 고용량 ICS를 고려한다", "초기 치료 1시간 이내에 재평가해 FEV1 또는 PEF가 60–80%이면서 증상이 호전되면 퇴원 계획을 고려한다", "GINA는 SpO2 95% 미만이면 산소를 시작하고, 투여 중 상한은 95%로 둔다", "국내 지침은 경증·중등증과 중증 모두 SpO2 93–95% 유지를 목표로 한다"], "answer": 3, "explanation": "GINA는 SpO2 92% 미만일 때 산소를 시작하고 상한을 95%로 둔다. 국내 지침(93–95% 유지)과 목표 범위가 다른 것이 아니라 산소를 언제 시작하느냐의 차이이며, GINA도 중증 악화에서 93–95%가 100% 고농도 산소보다 낫다고 본다(시험은 93–95%로 기억). 나머지는 그림 5-2 그대로다. 경증·중등증 치료 중 악화가 지속되면 중증으로 분류해 치료하고 중환자실 치료를 재평가하며, 재평가에서 FEV1·PEF <60% 또는 호전이 없으면 치료를 지속한다.", "source": "ASTHMA p.38 (보충 p.7) · 10/12 강의 00:49:08", "emphasis": true, "lecture": "asthma"}, {"id": "asthma-s01", "type": "short", "stem": "폐활량검사 슬라이드의 정의(TLC = RV + ___)에 따르면 빈칸에 들어갈 지표는? (영문 약어)", "answer": "FVC", "accept": ["FVC", "fvc", "노력폐활량", "노력성 폐활량", "노력성폐활량", "forced vital capacity", "Forced Vital Capacity"], "explanation": "슬라이드(보충 p.2에서 공개된 가려진 줄)의 정의는 TLC = RV + FVC다. RV는 끝까지 내쉬어도 남는 공기라 폐활량검사로는 측정할 수 없어 폐용적 검사가 따로 필요하다. 처음 1초 호기량인 FEV1과 혼동하지 않도록 주의한다. ※ 구조와기능 강의(5주차) 교수 계산식 TLC = VC(폐활량) + RV로 'VC'라고 쓰면 개념상 맞으므로 부분 정답으로 볼 수 있으나, 슬라이드 기준 답은 FVC다.", "source": "ASTHMA p.13 (보충 p.2) · 10/12 강의 00:21:03", "emphasis": true, "lecture": "asthma"}, {"id": "asthma-s02", "type": "short", "stem": "단계별 치료 1안 3단계에서 저용량 ICS-formoterol을 매일 유지하면서 증상이 있을 때도 같은 흡입기를 사용하는 요법을 영문 약어로 쓰시오.", "answer": "MART", "accept": ["MART", "mart", "Mart", "Maintenance And Reliever Therapy", "maintenance and reliever therapy", "Maintenance and Reliever Therapy", "유지 및 완화 요법", "유지 및 완화요법", "유지및완화요법", "유지 완화 요법", "유지완화요법", "SMART", "smart", "single maintenance and reliever therapy", "Single-inhaler Maintenance And Reliever Therapy"], "explanation": "MART(Maintenance And Reliever Therapy, 유지 및 완화 요법)는 1안 3단계부터 쓰며 한 흡입기로 조절과 증상 완화를 함께 한다. formoterol은 LABA지만 작용이 빨라 완화제로 쓸 수 있고, 1안 1–2단계는 매일 쓰는 조절제 없이 필요시에만 흡입한다는 점과 구분한다.", "source": "ASTHMA p.28 (보충 p.5) · 10/12 강의 00:34:35", "emphasis": true, "lecture": "asthma"}, {"id": "asthma-s03", "type": "short", "stem": "중증 천식 악화에서 추가로 고려하는 정주 약물로, 생리적 칼슘 길항제로 작용해 흡입제와 다른 경로로 기도평활근을 이완시키는 것은?", "answer": "마그네슘", "accept": ["마그네슘", "정주 마그네슘", "정주용 마그네슘", "IV 마그네슘", "황산마그네슘", "황산 마그네슘", "magnesium", "Magnesium", "magnesium sulfate", "MgSO4", "MgSO₄", "Mg", "IV Mg"], "explanation": "중증 악화 치료는 SABA+SAMA, 전신 스테로이드, 정주 마그네슘 고려, 고용량 ICS 고려, SpO2 93–95% 유지다. 평활근 수축에 필요한 세포 내 칼슘 상승을 마그네슘이 막아 이완시키며, 경증·중등증 치료(SABA·경구 스테로이드)에는 들어가지 않는다.", "source": "ASTHMA p.38 (보충 p.7) · 10/12 강의 00:48:38", "emphasis": true, "lecture": "asthma"}, {"id": "asthma-s04", "type": "short", "stem": "천식 환자의 중환자실 기계환기 일반원칙 3가지는 호기 시간 연장, 깊은 진정 회피, 그리고 다 내쉬지 못한 공기 때문에 호기말에 폐포 안에 남는 양압(PEEP)인 이것의 감시다. 이것은?", "answer": "auto-PEEP", "accept": ["auto-PEEP", "auto PEEP", "autoPEEP", "Auto-PEEP", "AutoPEEP", "오토 PEEP", "오토PEEP", "오토피프", "내인성 PEEP", "내재성 PEEP", "내인성 호기말양압", "내인성 호기말 양압", "intrinsic PEEP", "iPEEP", "PEEPi", "occult PEEP"], "explanation": "두 지침 모두 천식 기계환기에 구체적 권고가 없어 ① 호기 시간 연장 ② auto-PEEP 감시 ③ 깊은 진정 회피(대개 1–2일 내 급격히 호전)의 일반원칙을 따른다. 천식은 공기가 빠져나갈 호기 시간이 부족해 남은 공기가 쌓이고(air trapping·동적 과팽창), 그 결과 호기말 폐포에 양압(auto-PEEP)이 남는다. ※ 'air trapping'이나 '동적 과팽창'은 auto-PEEP을 만드는 현상이라 부분 정답으로 볼 수 있으나, 슬라이드의 감시 대상 용어는 auto-PEEP이다.", "source": "ASTHMA p.40 · 10/12 강의 00:52:21", "emphasis": true, "lecture": "asthma"}, {"id": "asthma-s05", "type": "short", "stem": "천식의 비약물 관리(금연)에서, 흡연력이 몇 갑년을 넘으면(초과) COPD 동반(asthma + COPD) 여부를 평가하는가? (숫자)", "answer": "10갑년", "accept": ["10갑년", "10", "10 갑년", "10갑", "10갑년 초과", "10 pack-years", "10 pack-year", "10 pack years", "10PY", "10 PY"], "explanation": "p.30 비약물 치료(금연·간접흡연 회피)에서 10갑년 초과 흡연력이 있으면 COPD 동반 여부를 평가한다. 교수는 ACO를 별도 질환이 아니라 'asthma + COPD'(두 질환이 같이 있는 상태)로 기술한다고 했고, 감별표에서 양쪽 소견 수가 비슷할 때도 ACO를 고려한다(p.18). COPD 강의도 40세 이상에서 흡연력 등 위험인자가 있으면 폐활량측정법(=폐활량검사)으로 진단하라고 한다(COPD p.11).", "source": "ASTHMA p.30, p.18 · COPD p.11", "emphasis": false, "lecture": "asthma"}, {"id": "asthma-s06", "type": "short", "stem": "국내 지침 단계별 치료(1안·2안 공통)에서 3단계 진입 기준은 '거의 매일 증상이 있거나 주 1회 이상 야간증상'이다. 여기에 무엇이 더해지면 4단계로 진입하는가?", "answer": "폐기능 저하", "accept": ["폐기능 저하", "폐기능저하", "폐기능 감소", "폐기능감소", "폐기능 저하 동반", "폐기능이 저하", "폐기능 악화", "저하된 폐기능", "lung function decline", "decreased lung function", "low lung function"], "explanation": "진입 기준 사다리는 2안 1단계 '증상 월 2회 미만' → 2안 2단계 '월 2회 이상~주 4–5일 미만'(1안은 1–2단계를 합쳐 '주 4–5일 미만') → 3단계 '거의 매일 증상 또는 주 1회 이상 야간증상' → 4단계 '여기에 폐기능 저하'다. 3단계 조절제는 1안 저용량 ICS-formoterol 유지(MART), 2안 저용량 ICS-LABA 유지이고, 4단계는 같은 약의 용량을 중간(2안은 중간/고)으로 올린다.", "source": "ASTHMA p.28 (보충 p.5) · 10/12 강의 00:33:38", "emphasis": true, "lecture": "asthma"}, {"id": "asthma-s07", "type": "short", "stem": "2–3개월 조절제 치료에도 증상이 지속되거나 급성악화를 보이면 단계를 올리기 전 5가지를 확인한다: 잘못된 흡입 방법, 위험인자의 지속적 노출, 호흡기계 증상과 동반 질환, 잘못된 진단, 그리고 나머지 1가지. 교수가 '잘못된 흡입 방법'과 함께 압도적으로 흔하다고 한 이 나머지 1가지는?", "answer": "낮은 순응도", "accept": ["낮은 순응도", "순응도", "순응도 저하", "순응도 불량", "낮은 치료 순응도", "치료 순응도 저하", "치료 순응도 불량", "약물 순응도 저하", "복약 순응도 저하", "복약 순응도 불량", "낮은 복약순응도", "불순응", "비순응", "poor adherence", "non-adherence", "nonadherence", "adherence", "compliance", "poor compliance"], "explanation": "step-up 전 확인 5가지는 잘못된 흡입 방법, 낮은 순응도, 위험인자의 지속적 노출, 호흡기계 증상과 동반 질환, 잘못된 진단이다. 앞의 두 가지는 슬라이드에 파란 글씨로 표시돼 있고 교수가 '압도적으로 흔하다'고 짚었다. 모두 확인해 문제가 없을 때 단계를 올린다.", "source": "ASTHMA p.29 · 10/12 강의 00:40:39", "emphasis": true, "lecture": "asthma"}, {"id": "asthma-s08", "type": "short", "stem": "천식 관련 사망 위험요인 중 'SABA 과다 사용'의 기준은 한 달에 벤토린(SABA)을 몇 통 이상 사용하는 경우인가?", "answer": "1통", "accept": ["1통", "한 통", "한통", "1통 이상", "한 통 이상", "1", "1개", "한 개"], "explanation": "사망 위험요인(표 5-2)은 삽관·인공호흡이 필요했던 치명적 천식 병력, 지난 1년 입원·응급실 방문, 스테로이드 사용 중이거나 최근 중단, ICS 미사용, SABA 과다 사용(월 1통 이상), 정신·심리사회 문제, 순응도 저하, 음식 알레르기다. SABA 단독·과다 사용이 위험하다는 점은 단계별 치료에서도 반복된다.", "source": "ASTHMA p.36", "emphasis": false, "lecture": "asthma"}, {"id": "asthma-s09", "type": "short", "stem": "제한성 환기장애를 '확진'하는 기준 지표로, RV와 마찬가지로 폐활량검사만으로는 측정되지 않아 폐용적 검사를 따로 해야 하는 것은? (영문 약어)", "answer": "TLC", "accept": ["TLC", "tlc", "총폐용량", "총 폐용량", "총폐용적", "총 폐용적", "전폐용량", "전 폐용량", "전폐용적", "폐총용량", "total lung capacity", "Total Lung Capacity"], "explanation": "교수 구두 보충: RV와 TLC는 폐활량검사만으로는 측정되지 않아 폐용적 검사를 따로 해야 하며, 제한성 환기장애의 확진 기준이 FVC가 아니라 TLC이기 때문에 중요하다. 폐활량검사(FVC·FEV1)는 기류제한과 기도가역성을 확인하는 일차 검사이고, TLC = RV + FVC다.", "source": "ASTHMA 보충 p.2 (p.13) · 10/12 강의 00:13:43", "emphasis": true, "lecture": "asthma"}, {"id": "ards-m01", "type": "mcq", "stem": "ARDS로 치료하던 중 X선이 악화되어 ARDS mimics를 감별하려 한다. mimic과 우선 치료 방향의 연결로 옳은 것은?", "choices": ["심인성(정수압성) 폐부종·단순 수액 과부하 – 수분 제거보다 전신 스테로이드를 먼저 시작", "급성 호산구성 폐렴·기질화 폐렴(COP) – 스테로이드에 반응하지 않으므로 지지요법만 유지", "CTD-ILD(항-MDA5 피부근염 RP-ILD 등) – 면역치료가 주 치료", "폐렴형 미만성 선암 – 경험적 항생제 유지가 원인 치료", "ANCA 혈관염의 미만성 폐포출혈 – 심인성 폐부종 범주이므로 이뇨제로 수분 제거"], "answer": 2, "explanation": "교수는 ARDS가 배제 진단 성격이 강하므로 치료는 유지하더라도 mimics(심인성 폐부종·CTD-ILD·급성 ILD·악성 종양)인지 꼭 확인하라고 했다. 출처를 나누면: CTD-ILD는 면역치료가 주 치료이고 심인성 폐부종·수액 과부하는 스테로이드가 아니라 CRRT·furosemide로 물을 뺀다는 것은 교수 발언(00:20:27)이다(0번 함정). 급성 호산구성 폐렴·COP가 스테로이드에 극적으로 반응한다는 것과 ANCA 혈관염 폐포출혈이 CTD 범주라는 것은 p.18 발표자 노트다(1·4번 함정). 폐렴형 선암은 악성 mimic이라 항생제로 원인이 교정되지 않는다.", "source": "ARDS p.18(본문·노트) · 10/19 강의 00:20:27", "emphasis": true, "lecture": "ards"}, {"id": "ards-m02", "type": "mcq", "stem": "2024 New Global Definition에서 새로 생긴 '비삽관(Non-intubated) ARDS'의 진단 조건으로 옳은 것은?", "choices": ["HFNO ≥60 L/min 적용 중 P/F ≤200 또는 S/F ≤235(SpO2 ≤97%일 때)이면 진단", "HFNO ≥30 L/min 또는 NIV/CPAP ≥5 cmH2O에서 P/F ≤300 또는 S/F ≤315", "산소 유량·PEEP 조건 없이 산소화 기준만 맞으면 진단하고 Mild·Moderate·Severe로 나눈다", "NIV로 PEEP ≥10 cmH2O를 적용한 상태에서만 P/F로 평가하며 S/F는 쓸 수 없다", "SpO2가 98~100%여도 S/F를 계산해 기준 이하이면 진단에 그대로 쓸 수 있다"], "answer": 1, "explanation": "비삽관 ARDS는 HFNO ≥30 L/min 또는 NIV/CPAP ≥5 cmH2O를 받는 환자에서 P/F ≤300 또는 S/F ≤315(SpO2 ≤97%일 때)로 진단하며 중증도는 나누지 않는다. 유량·PEEP 조건 없이 산소화 기준만 보는 것은 '자원 제한 환경' 범주이고, 이 범주도 중증도를 나누지 않는다. S/F는 SpO2 ≤97%일 때만 유효하다. 60 L/min은 교수가 저산소혈증 치료를 시작하는 유량이지 진단 기준이 아니다.", "source": "ARDS p.10, p.12", "emphasis": false, "lecture": "ards"}, {"id": "ards-m03", "type": "mcq", "stem": "ARDS 정의의 변천에 대한 설명으로 옳은 것은?", "choices": ["1988 Murray LIS는 CXR·P/F·PEEP·유순도 4개 항목 점수의 평균이 1.5점을 넘으면 ARDS로 본다", "1994 AECC 정의는 PEEP ≥5 cmH2O를 적용한 상태에서만 P/F를 평가해 ALI와 ARDS를 나눴다", "2012 Berlin 정의는 PAWP ≤18 mmHg 기준을 새로 추가했다", "2012 Berlin 정의로는 HFNO만 받는 환자를 ARDS로 진단할 수 없었다", "2024 New Global Definition은 발병 시점 기준을 1주 이내에서 2주 이내로 늘렸다"], "answer": 3, "explanation": "Berlin은 산소화를 PEEP/CPAP ≥5 cmH2O에서만 평가했기 때문에 HFNO 환자는 삽관 전까지 ARDS로 분류되지 않았고, 이것이 2024 정의에 비삽관 범주가 생긴 이유다. PEEP과 무관하게 P/F를 본 것과 PAWP ≤18은 AECC 기준이며 Berlin에서 PAWP는 삭제되었다. Murray LIS는 평균 >2.5이고, 2024 정의도 1주 이내를 유지한다.", "source": "ARDS p.5–8, p.11", "emphasis": false, "lecture": "ards"}, {"id": "ards-m04", "type": "mcq", "stem": "아직 ARDS가 아닌 패혈증 환자를 응급실에서 처음 기관삽관했다. 2차 타격을 막기 위해 교수가 강조한 초기 인공호흡기 설정은?", "choices": ["ARDS 진단 전까지는 실제 체중 기준 VT 8~10 mL/kg로 충분한 환기를 확보한다", "압력손상을 막기 위해 PEEP 0(ZEEP)으로 두고 VT 10 mL/kg PBW로 시작한다", "ARDS 진단이 확정되면 그때부터 VT를 6 mL/kg PBW로 낮추고 PEEP을 올린다", "VT를 4 mL/kg PBW 미만으로 낮추고 PEEP은 최소화한다", "처음부터 VT 6~8 mL/kg PBW로 하고 PEEP도 필요한 만큼 준다"], "answer": 4, "explanation": "슬라이드는 2차 타격 ① 손상성 기계환기를 피하려면 수술실·응급실 삽관 환자도 처음부터 저일회호흡량(6~8 mL/kg PBW)과 적절한 PEEP을 쓰라고 한다. 'ARDS가 아니니 크게 줘도 된다'(0·2번)는 발표자 노트가 금물로 꼽은 생각이고, 기준은 실제 체중이 아니라 PBW다. ARDS가 아닌 경우 SSC 2021도 4~6보다 6~8 mL/kg를 제안하므로 3번도 틀렸다.", "source": "ARDS p.21, p.64 · 10/19 강의 00:24:12", "emphasis": true, "lecture": "ards"}, {"id": "ards-m05", "type": "mcq", "stem": "다중 타격 가설과 ARDS 조기 인지에 대한 설명으로 옳지 않은 것은?", "choices": ["LUNG-SAFE에서 의료진은 대부분의 ARDS를 제때 인지했고, 놓친 경우는 주로 중증이었다", "대다수 환자는 입원 후 수 시간~수일에 걸쳐 ARDS로 진행하므로 2차 타격을 줄일 여지가 있다", "1차 타격(폐렴·패혈증·외상·쇼크)은 내원 전에 이미 일어난 비가역적 사건이다", "삽관 후 첫 1시간에 키를 재서 PBW를 계산하고 VT 6 mL/kg PBW로 시작하며 Pplat <30을 확인한다", "침상 머리 거상 30~45도와 구강 간호는 흡인으로 인한 2차 타격을 줄인다"], "answer": 0, "explanation": "LUNG-SAFE 등에서는 의료진이 ARDS를 인지하지 못한 비율이 높았고 특히 mild~moderate에서 많이 놓쳤다(p.22). 교수는 가장 먼저 중요한 것이 환자가 ARDS인지 제대로 판단하는 것이라고 했다(00:27:16). 진단이 늦으면 저VT·복와위도 늦어진다. 대다수 환자는 입원 후 수 시간~수일(노트: 24~72시간)에 걸쳐 진행하고, 1차 타격은 비가역적이지만 2차 타격(고VT·수액 과부하·P-SILI·수혈·흡인·감염원 조절 지연)은 예방할 수 있다.", "source": "ARDS p.19–22 · 10/19 강의 00:27:16", "emphasis": true, "lecture": "ards"}, {"id": "ards-m06", "type": "mcq", "stem": "ARDS 병태생리에 대한 설명으로 옳은 것은?", "choices": ["계면활성제는 1형 폐포세포(ATI)가 분비하므로 ATI 손상이 계면활성제 결핍의 주원인이다", "ARDS 폐부종은 장벽이 정상인 정수압성 부종이므로, 수액량이 같으면 심부전 환자와 부종 정도가 같다", "폐포액 제거(AFC) 기능 저하는 기계환기 기간 연장 및 높은 사망률과 직접 관련된다", "성인 ARDS에서도 외부 계면활성제 기도 투여는 미숙아 RDS처럼 사망률을 낮췄다", "섬유화 경로는 발병 14일 이후에만 시작되므로 첫 1주에는 고려하지 않아도 된다"], "answer": 2, "explanation": "슬라이드 p.26은 AFC 저하가 기계환기 기간 연장·높은 사망률과 직접 상관한다고 강조한다. 계면활성제는 2형 세포(ATII)가 만들고, ARDS는 투과성 부종이라 같은 수액에도 부종이 훨씬 심해지며, 성인 ARDS의 외부 계면활성제 시험은 모두 실패했다. 섬유화 경로는 빠르면 첫날부터 염증과 동시에 시작될 수 있다.", "source": "ARDS p.23, p.26–28, p.31", "emphasis": false, "lecture": "ards"}, {"id": "ards-m07", "type": "mcq", "stem": "ARDS의 생물학적 표현형 중 과염증형(Hyper-inflammatory)에 대한 설명으로 옳은 것은?", "choices": ["약 30%이며 쇼크·승압제 요구량·대사성 산증이 더 심하고 사망률이 높다", "전체의 약 70%를 차지하는 다수 표현형으로, 쇼크와 대사성 산증이 상대적으로 덜하다", "IL-6·IL-8·TNFR1은 낮고 중탄산염·단백질 C는 높은 바이오마커 양상을 보인다", "저염증형보다 VFD가 길고 사망률은 낮다", "입원 첫날 과염증형으로 분류되면 표현형은 치료 내내 바뀌지 않고 그대로 유지된다"], "answer": 0, "explanation": "교수는 과염증형(약 30%, 쇼크·노르에피네프린 요구량↑·대사성 산증, 사망률↑)과 저염증형(약 70%)을 대표적으로 알아야 할 표현형으로 꼽았다. 과염증형은 IL-6·IL-8·TNFR1이 높고 중탄산염·단백질 C가 낮다. 표현형은 치료에 따라 매일 바뀔 수 있으므로(dynamic heterogeneity) 4번도 틀렸다.", "source": "ARDS p.37, p.39 · 10/19 강의 00:44:45", "emphasis": true, "lecture": "ards"}, {"id": "ards-m08", "type": "mcq", "stem": "ARDS의 이질성(heterogeneity)과 임상시험에 대한 설명으로 옳은 것은?", "choices": ["모든 ARDS를 한 집단으로 묶은 statin·β2-agonist·iNO·surfactant 시험은 대부분 사망률을 낮췄다", "PROSEVA는 P/F 300 미만의 미선별 ARDS 전체를 대상으로 해 복와위의 이득을 처음 보였다", "치료 효과의 이질성(HTE)이란 같은 치료가 모든 하위표현형에서 같은 크기의 이득을 내는 현상이다", "simvastatin(HARP-2)은 전체에선 실패했지만 과염증형에선 생존율이 높았다", "예후를 개선한 것으로 확인된 치료는 주로 항염증 약물요법이다"], "answer": 3, "explanation": "교수는 ARDS 환자가 동질적이지 않아서 미선별(unselected) 연구는 대부분 실패했다고 강조했다. 같은 치료가 한 표현형에는 이득, 다른 표현형에는 해가 되어 평균이 0으로 상쇄되는 것이 HTE이고, simvastatin의 과염증형 생존 향상이 대표 예다. 예후를 개선한 것은 저VT(ARMA)·복와위(PROSEVA, P/F <150 대상)·수액(FACTT) 같은 생리적 지지요법뿐이다.", "source": "ARDS p.35–38 · 10/19 강의 00:42:16", "emphasis": true, "lecture": "ards"}, {"id": "ards-m09", "type": "mcq", "stem": "HFNO 중인 환자의 ROX index에 대한 설명으로 옳은 것은?", "choices": ["ROX = (PaO2/FiO2) ÷ 심박수로 계산하며, 값이 낮을수록 HFNO 성공 가능성이 높다", "ROX = (SpO2/FiO2) ÷ RR이며 2·6·12시간에 ≥4.88이면 계속 관찰한다", "NIV 시작 1시간째 5점을 넘으면 실패 위험이 높다고 판단하는 NIV 전용 지표다", "떨어지는 추세여도 cutoff 아래로 내려갈 때까지는 삽관을 미루고 HFNO를 유지한다", "HFNO 2시간째 ROX 4.0이면 지원 강화·재평가 없이 바로 삽관한다"], "answer": 1, "explanation": "ROX는 (SpO2/FiO2)÷RR로 높을수록 좋고, 2·6·12시간 추이로 평가한다(≥4.88이면 계속 관찰). 2시간째 삽관 고려 기준은 <2.85이고 4.0은 '지원 강화 후 30분 재평가' 구간(ΔROX <0.5면 삽관 고려, ≥0.5면 계속 관찰)이며, NIV 1시간째 >5는 HACOR 기준이다. 교수는 점수는 보조 도구일 뿐이므로 떨어지는 추세면 cutoff까지 기다리지 말고 삽관한다고 했다.", "source": "ARDS p.43–44 · 10/19 강의 01:04:27", "emphasis": true, "lecture": "ards"}, {"id": "ards-m10", "type": "mcq", "stem": "NIV 중인 저산소성 호흡부전 환자에서 NIV 실패 위험이 높아 삽관·진정을 서둘러야 할 신호로 슬라이드와 교수 설명에 맞는 것은?", "choices": ["NIV 1시간째 HACOR 3점(심박수·pH·GCS·P/F·RR 합산)", "압력보조 10 cmH2O에서 호기 일회호흡량(Vte) 6 mL/kg PBW", "NIV 첫 4시간 평균 호기 일회호흡량(Vte) 7 mL/kg PBW", "HACOR 항목 중 심박수 110회/분, GCS 15", "낮은 압력보조에도 NIV 첫 4시간 평균 Vte ≥9.5 mL/kg"], "answer": 4, "explanation": "NIV 첫 4시간 평균 Vte ≥9.5 mL/kg면 NIV 실패율이 약 75%(<9.5는 약 20%)로, 환자가 호흡근을 많이 써서 큰 Vt를 만들고 있다는 뜻이다. 교수는 이때 NIV를 끌지 말고 빨리 삽관·진정해 호흡근을 쉬게 하는 것이 1순위 전략이라고 했다. HACOR는 NIV 1시간째 >5점이 위험 기준이므로 3점은 해당하지 않는다.", "source": "ARDS p.44–45 · 10/19 강의 01:07:05", "emphasis": true, "lecture": "ards"}, {"id": "ards-m11", "type": "mcq", "stem": "구동압(ΔP = Pplat − PEEP)과 관련된 연구 결과로 옳은 것은?", "choices": ["Amato 2015: PEEP 고정 + ΔP↑여도 사망률은 변하지 않았다", "Amato 2015: Pplat을 고정하고 PEEP을 올려 ΔP를 낮추자 사망률이 오히려 올라갔다", "Costa 2021: 단일 환기 변수 중 사망과 유의하게 관련된 것은 PEEP과 Pplat이었다", "Amato 2015: ΔP를 같게 맞추면 PEEP·Pplat이 달라도 사망률 차이가 없었다", "Costa 2021: RR 1의 사망 영향이 ΔP 1의 약 4배이므로 PaCO2를 낮출 때는 ΔP를 먼저 올린다"], "answer": 3, "explanation": "Amato 2015 NEJM(9개 RCT, 약 3,500명)의 세 시나리오: ① PEEP 고정 + ΔP↑ → 사망↑ ② ΔP 동일 → PEEP·Pplat이 달라도 차이 없음 ③ Pplat 고정 + PEEP↑(ΔP↓) → 사망↓. 즉 사망은 PEEP이나 Pplat이 아니라 ΔP를 따르고, ΔP >15면 병원 사망이 늘었다. Costa 2021에서 단일 환기 변수 중 사망과 유의하게 관련된 것은 ΔP와 RR뿐이었고 ΔP의 영향이 약 4배라, 교수는 PaCO2를 빼려고 분당환기량을 늘릴 때 ΔP보다 RR을 먼저 올리라고 했다(4번은 거꾸로).", "source": "ARDS p.53–55, p.59 · 10/19 강의 01:18:18, 01:23:20", "emphasis": true, "lecture": "ards"}, {"id": "ards-m12", "type": "mcq", "stem": "ARMA trial(NEJM 2000)과 이에 대한 교수의 해석으로 옳은 것은?", "choices": ["산소화는 고VT군이 더 좋았지만 사망률은 저VT군(31.0% vs 39.8%)이 낮았다", "저VT군(6 mL/kg)과 전통군(12 mL/kg)의 사망률은 비슷했고 산소화만 개선되었다", "VT는 실제 체중(actual body weight) 기준으로 계산해 두 군에 똑같이 적용했다", "저VT군은 압력손상이 11%에서 10%로 유의하게 줄었고 이것이 사망 감소의 주된 근거였다", "저VT군의 Pplat 상한은 35 cmH2O였다"], "answer": 0, "explanation": "ARMA는 ARDS에서 처음으로 사망률 감소를 증명한 연구다(저VT 6 mL/kg PBW·Pplat ≤30 vs 12 mL/kg·≤50, 사망 31.0% vs 39.8%). 압력손상은 10% vs 11%로 유의한 차이가 없었다(p=0.43, 3번 함정). 교수는 VT를 많이 줄수록 산소화는 좋아지므로 이 연구에서도 산소화는 고VT군이 더 좋았지만 사망은 저VT군이 낮았다고 강조했다. '우리는 lab이 아니라 환자를 치료한다' — 산소화 수치보다 예후를 개선하는 저VT를 쓴다.", "source": "ARDS p.65–66 · 10/19 강의 01:30:02", "emphasis": true, "lecture": "ards"}, {"id": "ards-m13", "type": "mcq", "stem": "PEEP과 폐포 모집(recruitment)에 대한 설명으로 옳은 것은?", "choices": ["ART trial에서 폐포 모집술(RM)+점감식 PEEP 적정군은 저PEEP군보다 사망률이 유의하게 낮았다", "ESICM 2023 가이드라인은 중등~중증 ARDS에서 높은 PEEP을 강하게 권고한다", "ART 후속 서신: 사망 증가는 주로 recruitability가 거의 없는 환자에서 나타났다", "유순도·구동압 변화만으로 폐포 모집과 과팽창을 침상에서 정확히 구분할 수 있다", "폐초음파는 과팽창을 가장 정확히 보여 주므로 침상 PEEP 적정의 표준 도구다"], "answer": 2, "explanation": "ART에서 RM+PEEP 적정군은 사망이 오히려 늘었다(HR 1.20). 후속 Letter to the Editor(p.68)는 recruitability가 큰 환자가 1/3 이하였고 사망 증가는 주로 recruitability가 거의 없는 환자에서 나타났다고 정리한다. 즉 펴질 게 없는 폐에 RM·높은 PEEP을 준 것이 문제였다. 그래서 교수는 '맞는 폐에 맞는 PEEP'을 위해 recruitability를 평가하는 장비·기법(EIT 등)을 써서 PEEP을 개별화하라고 강조했다. ESICM 2023은 높은/낮은 PEEP 모두 권고하지 않고, 유순도·ΔP는 모집과 과팽창을 구분하지 못하며, 폐초음파는 과팽창을 보지 못한다.", "source": "ARDS p.67–71 · 10/19 강의 01:32:49", "emphasis": true, "lecture": "ards"}, {"id": "ards-m14", "type": "mcq", "stem": "복와위(prone positioning)에 대한 설명으로 옳지 않은 것은?", "choices": ["SSC 2021은 중등~중증 ARDS에서 하루 12시간 넘게 복와위를 제안한다", "PROSEVA는 P/F <150 환자에서 하루 최소 16시간 복와위로 생존율 개선을 보였다", "절대 금기는 불안정 척추 골절이다", "APRONET에서 복와위를 하지 않은 환자의 약 64%가 '저산소증이 충분히 심하지 않다'는 판단을 이유로 들었다", "메타분석에서 하루 12시간 미만의 복와위도 사망률을 유의하게 낮췄다"], "answer": 4, "explanation": "메타분석에서 사망 감소는 12시간 초과군에서만(RR 0.74) 나타났고 12시간 미만은 효과가 없었다(RR 1.03). APRONET 표(p.79)에서 '저산소증이 충분히 심하지 않다'는 이유가 전체 64.3%였고, 교수는 P/F를 계산하지 않고 FiO2·SpO2만 보고 판단한 탓이라고 했다. 교수는 복와위를 늦게 하면 사망률이 오르므로 적용 대상(중등~중증, P/F 기준)인지 매일 평가하라고 강조했다.", "source": "ARDS p.72, p.78–79 · 10/19 강의 01:41:12", "emphasis": true, "lecture": "ards"}, {"id": "ards-m15", "type": "mcq", "stem": "ARDS에서 신경근차단제(=신경근육차단제, NMBA) 사용에 대한 설명으로 옳은 것은?", "choices": ["SSC 2021 권고 77은 중등~중증 ARDS에서 지속 주입보다 간헐 볼루스를 제안한다(조건부)", "복와위 환기 중에는 NMBA 지속 주입이 금기이므로 간헐 볼루스만 사용한다", "ICU-AW는 NMBA 약물 자체 때문이므로 deep sedation만 하고 NMBA를 피하면 예방된다", "ROSE trial에서 48시간 지속 주입군의 사망률이 필요 시 볼루스군보다 유의하게 낮았다", "이전 RCT 3개에서 NMBA 지속 주입은 미사용보다 90일 사망률을 오히려 높였다"], "answer": 0, "explanation": "SSC 2021 권고 77은 중등~중증 ARDS에서 지속 주입보다 간헐 볼루스를 제안한다(조건부, 근거 중등도). 근거는 이전 RCT 3개(NMBA 지속 주입이 미사용보다 90일 사망 감소, 4번은 거꾸로)와 최근 ROSE trial(1,006명, 48시간 지속 주입 vs 필요 시 볼루스 → 사망 등 결과 차이 없음, 3번은 거꾸로)의 대비이며, 쓰지 말라는 뜻은 아니다. 같은 슬라이드 회색 박스(COVID-19 가이드라인, 약한 권고)는 지속적 비동조·깊은 진정 지속·복와위·지속적 높은 Pplat이면 최대 48시간 지속 주입을 제안한다(1번 함정). 2번: NMBA도 ICU-AW를 늘릴 수 있지만(ARDS p.81, 약물 p.23 RR 1.16) 교수는 부동이 주 기전이라 deep sedation만으로도 생긴다고 했다 → NMBA를 피한다고 예방되지 않는다. 그래서 쓸 때는 확실히 쓰고 아니면 light sedation으로 가도록 치료 노선을 분명히 하라고 했다. [보충] 약물 강의 p.23의 깊은/얕은 진정 대조군 = 이전 RCT 3개/ROSE.", "source": "ARDS p.80–81 · DRUG p.23 · 10/19 강의 01:43:53", "emphasis": true, "lecture": "ards"}, {"id": "ards-m16", "type": "mcq", "stem": "VV-ECMO 초기 설정과 ECMO 중 인공호흡기 관리에 대한 설명으로 옳지 않은 것은?", "choices": ["항응고는 비분획 헤파린(UFH)으로 aPTT 40~60초를 목표로 할 수 있다", "FDO2는 1.0으로 시작한 뒤 동맥 PaO2를 보며 낮춘다", "고탄산혈증을 빨리 교정하기 위해 sweep gas를 높은 유량으로 시작한다", "인공호흡기는 Pplat <25 cmH2O, PEEP ≥10 cmH2O로 폐를 쉬게 한다", "호흡수는 4~15회/분 또는 자발호흡으로 최소화하고 FiO2도 최소로 줄인다"], "answer": 2, "explanation": "sweep gas는 PaCO2가 급격히 떨어지지 않도록 낮게(1~2 L/min) 시작해 조금씩 올린다. 교수는 PaCO2가 한 번에 급감하면 뇌출혈 등이 생길 수 있다고 했다. 나머지는 슬라이드 그대로이며, ECMO가 환기를 대신하므로 호흡수를 25~30으로 걸지 않고 폐를 쉬게 하는 것(lung rest)이 핵심이다(일반 ARDS Pplat ≤30과 ECMO 중 <25를 혼동하지 않는다).", "source": "ARDS p.89 · 10/19 강의 01:48:59", "emphasis": true, "lecture": "ards"}, {"id": "ards-m17", "type": "mcq", "stem": "VV-ECMO 적용 결정에 대한 설명으로 옳은 것은?", "choices": ["LIFEGARDS: 삽관~ECMO 시작 지연 1일마다 6개월 사망↑ → 조기 선별", "해로운 기계환기에 오래 노출된 환자일수록 ECMO의 이득이 커서 우선 적용 대상이다", "심초음파에서 심한 좌심실 기능부전이 확인되면 VV-ECMO를 선택한다", "ECMO 경험이 적은 센터라도 전원 지연을 피하려면 자체적으로 VV-ECMO를 시작하는 것이 SSC 권고다", "ECMO 적용은 산소화 지표만으로 결정하며 환자·가족의 선호와 가치는 고려하지 않는다"], "answer": 0, "explanation": "LIFEGARDS에서 삽관~ECMO 지연 1일마다 6개월 사망 위험이 올라갔고(OR 1.08), 교수는 늦게 걸수록 예후가 나쁘니 조기에 선별해 결정하라고 강조했다(01:48:19). SSC 2021 권고 78은 기존 기계환기가 실패한 중증 ARDS에서 '경험·인프라를 갖춘 센터'의 VV-ECMO를 조건부로 제안하며, 교수는 경험 센터가 아니면 전원을 준비하라고 했다(01:47:16, 3번 함정). 장기간 해로운 기계환기 노출은 금기 항목이고, 심한 좌심실 기능부전이면 VA-ECMO이며, 결정 흐름에는 환자·가족의 선호와 가치가 들어간다.", "source": "ARDS p.84–88 · 10/19 강의 01:47:16, 01:48:19", "emphasis": true, "lecture": "ards"}, {"id": "ards-m18", "type": "mcq", "stem": "ATS 2024 ARDS 가이드라인 요약 그림에서 '강한 찬성 권고(Strong recommendation in favor)'로만 묶인 것은?", "choices": ["높은 PEEP(P/F ≤200), 신경근차단제(중증)", "폐보호 환기(VT 6 mL/kg PBW·Pplat ≤30), 복와위", "전신 코르티코스테로이드(전 중증도), VV-ECMO(중증)", "장시간 폐포 모집술(RM), 고빈도 진동 환기(HFOV)", "복와위(약 P/F ≤150), 신경근차단제(P/F <100)"], "answer": 1, "explanation": "초록(강한 찬성)은 생존율이 입증된 저일회호흡량 폐보호 환기와 복와위 두 가지다. 높은 PEEP(P/F ≤200), NMBA·VV-ECMO(중증), 전신 스테로이드(전 중증도, 조건부 권고·근거 중등도)는 조건부 찬성(노랑)이고, 장시간 RM과 HFOV는 강한 반대(빨강)다. 4번은 NMBA가 조건부라서 틀렸다. 스테로이드는 초기 삼출기(24~72시간, 늦어도 7일 이내)에 써야 하고 섬유화기에 새로 시작하면 효과가 없다(p.30–31 노트). 이 그림의 ATS 2024는 약물 강의 p.19의 ATS(2023년 9월 승인)와 같은 지침이다.", "source": "ARDS p.91, p.30–31 노트 · DRUG p.19", "emphasis": false, "lecture": "ards"}, {"id": "ards-m19", "type": "mcq", "stem": "교수가 강조한 ARDS 표현형과 치료 가능한 특성(treatable traits)에 대한 설명으로 옳은 것은?", "choices": ["표현형 분류의 목적은 P/F에 따른 중증도(mild·moderate·severe)를 더 잘게 나누는 것이다", "역학적 특성(mechanical trait)은 IL-6·IL-8 등으로 나누는 과염증형 vs 저염증형 구분이다", "원인/미생물 특
