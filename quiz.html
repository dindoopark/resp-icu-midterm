성은 ARDS로 진단된 뒤의 문제이므로 ARDS mimics 감별과는 관계가 없다", "핵심 구분 둘은 과염증형 vs 저염증형, 그리고 PEEP에 recruitable한지 여부다", "우심실 부전·높은 사강 같은 혈관 특성은 치료 표적이 아니므로 4축에서 빠진다"], "answer": 3, "explanation": "p.39의 treatable traits 4축은 원인/미생물(가역 원인·ARDS mimics), 생물학적(hyper vs hypo-inflammatory), 역학(high vs low recruitability), 혈관/혈역학(RV 부전·높은 사강)이다. 슬라이드는 P/F 중증도만으로 분류하지 말고 즉각 표적 중재가 가능한 특성을 찾으라고 한다. 교수는 표현형이 치료에 따라 바뀌므로(25~50%) 치료 가능한 특성을 잘 찾아내야 하고, 그중 핵심은 과염증형 vs 저염증형과 recruitable 환자인지 여부라고 강조했다.", "source": "ARDS p.39 · 10/19 강의 00:46:52, 00:46:58", "emphasis": true, "lecture": "ards"}, {"id": "ards-m20", "type": "mcq", "stem": "인공호흡기 유발 폐손상(VILI)과 인공호흡의 해악을 줄이는 전략에 대한 설명으로 옳은 것은?", "choices": ["슬라이드의 VILI 4대 기전은 압력·용적·무기폐·에너지(ergo) 손상이며 생물손상은 포함되지 않는다", "생물손상(biotrauma)은 폐 안에만 국한된다", "폐 불균질성을 줄이는 방법은 NMBA·ECMO이고, mechanical power를 줄이는 방법은 PEEP·복와위다", "P-SILI를 막으려면 깊은 진정과 NMBA를 가능한 한 오래 유지할수록 폐와 횡격막에 모두 좋다", "생물손상은 IL-8 등 매개체가 순환으로 퍼져 다장기부전까지 일으킬 수 있다"], "answer": 4, "explanation": "슬라이드 빨간 박스의 VILI 4대 기전은 압력손상·용적손상·무기폐손상·생물손상이다(ergotrauma는 2016년에 추가된 mechanical power 개념). 생물손상은 IL-8 등 매개체가 폐포에서 순환으로 넘어가 다장기부전으로 이어질 수 있고, 교수는 그래서 이 요소들을 조절하며 인공호흡기를 유지하라고 했다(01:08:21). 해악을 줄이는 2대 전략(p.60)은 ① mechanical power 최소화(VT·ΔP·RR↓, NMBA, ECMO) ② 폐 불균질성 최소화(적절한 PEEP, 복와위)다(2번은 뒤바꿈). 과도한 진정·NMBA는 횡격막 불용성 위축을 일으키므로(3번 함정) 노력은 너무 낮지도 높지도 않게 맞춘다(p.63).", "source": "ARDS p.46, p.60, p.63 · 10/19 강의 01:08:21", "emphasis": true, "lecture": "ards"}, {"id": "ards-m21", "type": "mcq", "stem": "Gattinoni의 'baby lung' 개념에 대한 설명으로 옳은 것은?", "choices": ["ARDS 폐 전체가 골고루 딱딱해져(diffuse stiffness) 호흡기계 유순도가 낮아진 상태를 말한다", "환기되는 폐가 5~6세 아이 크기로 작아진 것이며, 남은 폐의 유순도는 거의 정상이다", "등쪽(dependent)은 정상적으로 환기되고 배쪽(non-dependent)만 경화·무기폐가 된 상태다", "baby lung 개념은 VT를 실제 체중 기준으로 넉넉히 줘야 남은 폐가 펴진다는 근거가 된다", "남은 폐는 유순도가 매우 낮아 높은 VT로 펴야 한다"], "answer": 1, "explanation": "CT 정량 분석에서 ARDS 폐는 등쪽(중력 의존 부위)의 무기폐·경화와 배쪽에 남은 작은 정상 환기 영역으로 나뉜다. 남은 폐는 성인의 20~30%, 5~6세 아이 크기이고 그 자체의 유순도는 거의 정상이라 '딱딱한 폐'가 아니라 '작은 폐'다. 그래서 성인 체격대로 VT를 주면 이 작은 폐가 과팽창된다 — 저VT·ΔP 제한의 근거다. 교수는 baby lung 개념이 중요하니 알아 두라고 했다.", "source": "ARDS p.32 · 10/19 강의 00:37:34", "emphasis": true, "lecture": "ards"}, {"id": "ards-s01", "type": "short", "stem": "[암기 점검] 2024 New Global Definition에서 ABGA 없이 삽관 ARDS의 중증도를 SpO2/FiO2로 분류할 때(SpO2 ≤97%), Severe의 기준은 S/F ≤ ( ? )이다. 빈칸의 숫자는?", "answer": "148", "accept": ["148", "≤148", "≤ 148", "148 이하", "S/F 148", "S/F ≤148", "S/F ≤ 148", "SpO2/FiO2 148", "SpO2/FiO2 ≤148", "SF 148"], "explanation": "삽관 ARDS는 PEEP ≥5에서 Mild = P/F 200–300(S/F 235–315), Moderate = P/F 100–200(S/F 148–235), Severe = P/F ≤100(S/F ≤148)로 나눈다. 'P/F 300·200·100 ↔ S/F 315·235·148'로 외운다. 비삽관 ARDS와 자원 제한 환경은 S/F ≤315 한 줄뿐이고 중증도를 나누지 않는다.", "source": "ARDS p.10, p.12", "emphasis": false, "lecture": "ards"}, {"id": "ards-s02", "type": "short", "stem": "[암기 점검] ARDS에서 FiO2를 올려도 잘 교정되지 않는 불응성 저산소혈증의 1차(가장 중요한) 기전은?", "answer": "폐내 단락(shunt)", "accept": ["shunt", "Shunt", "션트", "단락", "폐내 단락", "폐내단락", "폐내 션트", "intrapulmonary shunt", "right-to-left intrapulmonary shunt", "right-to-left shunt", "우-좌 단락", "우→좌 단락", "우-좌 폐내 단락", "우→좌 폐내 단락", "폐내 단락(shunt)", "우좌단락", "우좌 단락", "폐내 우좌단락", "우-좌 션트", "우좌 션트", "R-L shunt", "R→L shunt", "R to L shunt", "shunting", "intrapulmonary shunting", "V/Q=0", "VA/Q=0", "V/Q 0"], "explanation": "슬라이드 p.4(Hallmarks)는 동맥 저산소혈증의 원인을 폐내 단락(intrapulmonary shunt)으로 제시하고, p.33은 1차 기전을 우→좌 폐내 단락(V/Q = 0), 2차 기전을 low V/Q mismatch + 저산소성 폐혈관수축(HPV) 소실로 제시한다. 혈류는 흐르지만 환기가 전혀 안 되는 폐포라서 shunt가 약 30%를 넘으면 FiO2를 100%로 올려도 반응하지 않는다. low V/Q mismatch라고 답하면 2차 기전과 혼동한 것이다.", "source": "ARDS p.4, p.33 · 10/19 강의 00:39:20", "emphasis": true, "lecture": "ards"}, {"id": "ards-s03", "type": "short", "stem": "[암기 점검] ARDS의 간접(폐외성) 원인 중 가장 흔한 것은?", "answer": "비폐성 패혈증", "accept": ["비폐성 패혈증", "비폐성패혈증", "폐외 패혈증", "폐외성 패혈증", "폐 이외의 패혈증", "폐 외 패혈증", "패혈증", "non-pulmonary sepsis", "nonpulmonary sepsis", "Non-pulmonary sepsis", "extrapulmonary sepsis", "sepsis", "non pulmonary sepsis", "extra-pulmonary sepsis", "비폐성 sepsis", "폐외 감염", "폐외 감염(패혈증)", "비폐성 감염", "nonpulmonary infection"], "explanation": "직접(폐성) 원인은 폐렴이 1위, 위 내용물 흡인이 2위이고, 간접(폐외성) 원인은 복강·요로 패혈증 같은 비폐성 패혈증이 가장 흔하다. 간접 손상은 전신 염증 매개체가 혈관 내피를 먼저 공격한다. 폐렴이라고 답하면 직접 원인 1위와 혼동한 것이다.", "source": "ARDS p.16", "emphasis": false, "lecture": "ards"}, {"id": "ards-s04", "type": "short", "stem": "[암기 점검] VV-ECMO 초기 설정에서 펌프 속도를 맞춰 확보해야 하는 최소 혈류량은 몇 L/min인가?", "answer": "3 L/min", "accept": ["3", "3 L/min", "3L/min", "3 L", "3L", "3리터", "3 L/min 이상", "≥3 L/min", "≥ 3 L/min", "최소 3 L/min", "3 lpm", "3LPM", "3 L/분", "3L/분", "분당 3 L", "3리터/분", "3~6 L/min", "3–6 L/min", "3-6 L/min"], "explanation": "슬라이드는 혈류가 최소 3 L/min이 되도록 펌프 속도를 맞추라고 하고, 교수는 3~6 L로 걸어야 하며 국내에서 3 L 미만으로 거는 경우가 많다고 지적했다. FDO2는 1.0에서 시작하고 sweep gas는 1~2 L/min으로 낮게 시작하는 것과 구분한다.", "source": "ARDS p.89 · 10/19 강의 01:48:41", "emphasis": true, "lecture": "ards"}, {"id": "ards-s05", "type": "short", "stem": "[암기 점검] 삽관된 ARDS 환자(발병 24시간)가 FiO2 0.5에서 PaO2 70 mmHg(SpO2 약 94%)이다. P/F ratio는 얼마인가?", "answer": "140", "accept": ["140", "140 mmHg", "140mmHg", "P/F 140", "PF 140", "P/F ratio 140", "P/F = 140", "PaO2/FiO2 140"], "explanation": "P/F = 70 ÷ 0.5 = 140이다. SpO2 94%라 괜찮아 보여도 p.78 기준(중증 ARDS P/F <150, 가능하면 48시간 이내)으로 복와위 대상이다. 교수의 예(FiO2 0.4·PaO2 60 → P/F 150)처럼, APRONET에서 복와위를 못 한 1번 원인은 P/F를 계산하지 않고 FiO2·SpO2만 본 것이었다. 교수는 복와위 대상자인지 매일 평가하라고 강조했다.", "source": "ARDS p.78–79 · 10/19 강의 01:41:12", "emphasis": true, "lecture": "ards"}], LN={"drug": "약물", "struct": "구조와 기능", "copd": "COPD", "asthma": "천식", "ards": "ARDS"};

    d.innerHTML=meta+'<div class="stem"><span class="num">Q'+(i+1)+'.</span>'+esc(q.stem)+'</div>'+inner+ex;

        d.querySelectorAll('.choices button').forEach(function(x){x.disabled=true; if(Number(x.dataset.j)===Number(q.answer)) x.classList.add('correct')});
        if(!ok) b.classList.add('wrong');
        res.innerHTML='<span class="verdict '+(ok?'ok">정답!':'no">오답')+'</span>'; rv.classList.add('show'); record(q.id,ok)})})
    } else {
      var inp=d.querySelector('input'), bs=d.querySelectorAll('.sa .btn');
      function check(){var v=norm(inp.value); if(!v) return;
        var acc=[q.answer].concat(q.accept||[]).map(norm), ok=acc.some(function(a){return a&&(v===a)});
        rv.classList.add('show');
        if(ok){res.innerHTML='<span class="verdict ok">정답!</span>'; record(q.id,true)}
        else{res.innerHTML='<span class="verdict no">자동 채점 불일치</span> 표현만 다를 수 있어요. 스스로 채점:<div class="selfgrade"><button class="btn" data-ok="1">⭕ 맞음</button><button class="btn" data-ok="0">❌ 틀림</button></div>';
          res.querySelectorAll('.selfgrade .btn').forEach(function(sb){sb.addEventListener('click',function(){record(q.id,sb.dataset.ok==='1'); res.innerHTML='<span class="verdict '+(sb.dataset.ok==='1'?'ok">맞음 처리':'no">틀림 처리')+'</span>'})})}}
      inp.addEventListener('keydown',function(e){if(e.key==='Enter') check()});
      bs[0].addEventListener('click',check);
      bs[1].addEventListener('click',function(){rv.classList.add('show'); if(!(q.id in done)){res.innerHTML='<div class="selfgrade"><button class="btn" data-ok="1">⭕ 알고 있었음</button><button class="btn" data-ok="0">❌ 몰랐음</button></div>';
        res.querySelectorAll('.selfgrade .btn').forEach(function(sb){sb.addEventListener('click',function(){record(q.id,sb.dataset.ok==='1'); res.innerHTML=''})})}});
    }
    el.appendChild(d)});
}
function bindChips(attr,key){document.querySelectorAll('.chip[data-'+attr+']').forEach(function(c){c.addEventListener('click',function(){
  document.querySelectorAll('.chip[data-'+attr+']').forEach(function(x){x.classList.remove('on')}); c.classList.add('on'); state[key]=c.dataset[attr]; render()})})}
bindChips('lec','lec'); bindChips('type','type');
[['fEmph','emph'],['fWrong','wrong'],['fShuffle','shuffle']].forEach(function(p){var b=document.getElementById(p[0]);
  b.addEventListener('click',function(){state[p[1]]=!state[p[1]]; b.classList.toggle('on',state[p[1]]); render()})});
document.getElementById('fReset').addEventListener('click',function(){if(confirm('정답 기록과 오답 목록을 지울까요?')){done={};wrongSet={};saveWrong();score();render()}});
render(); score();
</script></body></html>
